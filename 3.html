<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>SkipCut Test v3 - Auto Unmute Fixed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 6px; color: #f84545; }
    .info { color: #aaa; font-size: 0.9rem; margin-bottom: 18px; text-align: center; max-width: 700px; }
    .player-wrapper {
      width: 100%;
      max-width: 960px;
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .player-wrapper::before {
      content: '';
      display: block;
      padding-top: 56.25%;
    }
    #player {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    .unmute-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
      transition: opacity 0.35s;
    }
    .unmute-overlay.hidden { opacity: 0; pointer-events: none; }
    .unmute-btn {
      background: #f84545;
      color: white;
      border: none;
      padding: 16px 28px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(248,69,69,0.4);
    }
    .unmute-btn:hover { background: #d63a3a; transform: scale(1.05); }
    .controls {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #f84545;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { background: #d63a3a; }
    button.secondary { background: #333; }
    button.secondary:hover { background: #444; }
    .status {
      margin-top: 16px;
      padding: 12px 16px;
      background: #1a1a1a;
      border-radius: 8px;
      font-size: 0.95rem;
      max-width: 960px;
      width: 100%;
      text-align: center;
    }
    .status.ok { border-left: 4px solid #4caf50; }
    .status.warn { border-left: 4px solid #ff9800; }
    .status.ended { 
      border-left: 4px solid #f84545; 
      background: #2a1515;
      font-weight: 600;
    }
    .log-box {
      margin-top: 16px;
      max-width: 960px;
      width: 100%;
      background: #1a1a1a;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.85rem;
      color: #bbb;
      max-height: 200px;
      overflow-y: auto;
    }
    .log-box div { padding: 3px 0; border-bottom: 1px solid #222; }
    .log-box .time { color: #888; margin-right: 8px; }
    .ended-banner {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: linear-gradient(135deg, #f84545, #d63a3a);
      border-radius: 12px;
      text-align: center;
      max-width: 960px;
      width: 100%;
    }
    .ended-banner.show { display: block; }
    .console-hint { margin-top: 12px; font-size: 0.8rem; color: #666; text-align: center; }
  </style>
</head>
<body>

  <h1>Autoplay + 1sn Otomatik Ses (Düzeltildi)</h1>
  <div class="info">
    Video: <strong>YWp89_AlpTQ</strong><br>
    Sessiz başlar → 1 sn sonra ses açılır ve <strong>oynatma devam eder</strong>.
  </div>

  <div class="player-wrapper">
    <div id="player"></div>
    <div id="unmuteOverlay" class="unmute-overlay" onclick="unmuteVideo(true)">
      <button class="unmute-btn">🔊 Sesi Aç</button>
    </div>
  </div>

  <div class="controls">
    <button onclick="loadVideo()">Yeniden Başlat</button>
    <button class="secondary" onclick="player && player.pauseVideo()">Duraklat</button>
    <button class="secondary" onclick="player && player.playVideo()">Oynat</button>
    <button class="secondary" onclick="unmuteVideo(true)">Sesi Aç</button>
    <button class="secondary" onclick="clearLog()">Logu Temizle</button>
  </div>

  <div id="status" class="status warn">Player yükleniyor...</div>

  <div id="endedBanner" class="ended-banner">
    🎬 VİDEO BİTTİ!
    <div style="font-size:0.9rem; margin-top:8px; opacity:0.9;">Konsola yazıldı → F12</div>
  </div>

  <div class="log-box" id="logBox">
    <div><span class="time">--:--:--</span> Sistem hazır...</div>
  </div>

  <div class="console-hint">F12 → Console</div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const VIDEO_ID = 'YWp89_AlpTQ';
    let player = null;
    let hasEnded = false;
    let isMuted = true;
    let unmuteAttempted = false;
    let unmuteTimer = null;
    let ignorePauseUntil = 0; // unMute sonrası gelen sahte PAUSE'u yoksay

    function onYouTubeIframeAPIReady() {
      console.log('%c[SkipCut] API hazır', 'color: #4caf50; font-weight: bold');

      player = new YT.Player('player', {
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 1,
          mute: 1,
          controls: 1,
          modestbranding: 1,
          rel: 0,
          iv_load_policy: 3,
          fs: 1,
          playsinline: 1,
          enablejsapi: 1,
          origin: window.location.origin
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      setStatus('Player hazır · Sessiz autoplay', 'ok');
      log('Player hazır · Sessiz autoplay');
      console.log('%c[SkipCut] Player hazır', 'color: #4caf50; font-weight: bold');

      hasEnded = false;
      unmuteAttempted = false;
      hideEndedBanner();

      try {
        event.target.mute();
        event.target.playVideo();
      } catch (e) {
        console.warn('[SkipCut] playVideo hatası:', e);
      }
    }

    function onPlayerStateChange(event) {
      const state = event.data;
      const names = { '-1':'UNSTARTED', '0':'ENDED', '1':'PLAYING', '2':'PAUSED', '3':'BUFFERING', '5':'CUED' };
      console.log(`%c[SkipCut] State → ${names[state] || state} (${state})`, 'color: #2196f3');

      if (state === YT.PlayerState.ENDED) {
        hasEnded = true;
        setStatus('🎬 VİDEO BİTTİ (ENDED)', 'ended');
        showEndedBanner();
        log('✅ VİDEO BİTTİ');
        console.log('%c[SkipCut] 🎬 VİDEO BİTTİ!', 'color: #f84545; font-size: 14px; font-weight: bold');
        console.log('[SkipCut] data:', { event: 'video_ended', videoId: VIDEO_ID, timestamp: new Date().toISOString() });
        clearUnmuteTimer();
      }
      else if (state === YT.PlayerState.PLAYING) {
        log('▶️ Oynatılıyor' + (isMuted ? ' [muted]' : ' [sesli]'));
        setStatus(isMuted ? 'Oynatılıyor (sessiz) · 1sn sonra ses açılacak' : 'Oynatılıyor (sesli)', 'ok');

        if (hasEnded) {
          hasEnded = false;
          hideEndedBanner();
        }

        // 1 saniye sonra otomatik ses aç
        if (isMuted && !unmuteAttempted) {
          clearUnmuteTimer();
          unmuteTimer = setTimeout(() => {
            autoUnmute();
          }, 1000);
        }
      }
      else if (state === YT.PlayerState.PAUSED) {
        // unMute() bazen sahte PAUSE event'i gönderiyor → kısa süre yoksay
        if (Date.now() < ignorePauseUntil) {
          console.log('[SkipCut] Sahte PAUSE yoksayıldı (unmute sonrası)');
          // Hemen tekrar oynat
          try { player.playVideo(); } catch(e) {}
          return;
        }
        setStatus('Duraklatıldı', 'warn');
        log('⏸️ Duraklatıldı');
        clearUnmuteTimer();
      }
      else if (state === YT.PlayerState.BUFFERING) {
        log('⏳ Buffering...');
      }
    }

    function onPlayerError(event) {
      setStatus('Hata: ' + event.data, 'warn');
      log('❌ Hata: ' + event.data);
      console.error('[SkipCut] Hata:', event.data);
    }

    function autoUnmute() {
      if (!player || !isMuted || unmuteAttempted) return;
      unmuteAttempted = true;

      console.log('[SkipCut] 1sn geçti → unmute + playVideo');

      try {
        // unMute sırasında gelebilecek sahte PAUSE'u 1.5 sn yoksay
        ignorePauseUntil = Date.now() + 1500;

        player.unMute();
        player.setVolume(100);

        // Kritik: unmute sonrası mutlaka tekrar play
        player.playVideo();

        setTimeout(() => {
          const stillMuted = player.isMuted();
          if (!stillMuted) {
            isMuted = false;
            document.getElementById('unmuteOverlay').classList.add('hidden');
            setStatus('Oynatılıyor (sesli)', 'ok');
            log('🔊 Ses otomatik açıldı (1sn sonra)');
            console.log('%c[SkipCut] ✅ Otomatik unmute + play başarılı', 'color: #4caf50; font-weight: bold');
          } else {
            log('⚠️ Otomatik ses açılamadı · butona tıkla');
            setStatus('Oynatılıyor (sessiz) · Butona tıkla', 'warn');
            console.warn('[SkipCut] Unmute engellendi');
          }
          // Bir kez daha play güvencesi
          try { player.playVideo(); } catch(e) {}
        }, 250);
      } catch (e) {
        console.warn('[SkipCut] autoUnmute hatası:', e);
        log('⚠️ Otomatik ses açılamadı · butona tıkla');
      }
    }

    function unmuteVideo(fromUser = false) {
      if (!player) return;
      try {
        ignorePauseUntil = Date.now() + 1500;
        player.unMute();
        player.setVolume(100);
        player.playVideo();
        isMuted = false;
        unmuteAttempted = true;
        document.getElementById('unmuteOverlay').classList.add('hidden');
        setStatus('Oynatılıyor (sesli)', 'ok');
        log('🔊 Ses açıldı' + (fromUser ? ' (manuel)' : ''));
        console.log('[SkipCut] Ses açıldı (manuel) + playVideo');
      } catch (e) {
        console.warn('[SkipCut] unMute hatası:', e);
      }
    }

    function loadVideo() {
      if (!player) return;
      hasEnded = false;
      isMuted = true;
      unmuteAttempted = false;
      clearUnmuteTimer();
      hideEndedBanner();
      document.getElementById('unmuteOverlay').classList.remove('hidden');

      player.loadVideoById({ videoId: VIDEO_ID, startSeconds: 0 });
      setTimeout(() => {
        try {
          player.mute();
          player.playVideo();
        } catch(e) {}
      }, 400);

      setStatus('Yeniden yükleniyor (sessiz)...', 'warn');
      log('🔄 Video yeniden yüklendi');
    }

    function clearUnmuteTimer() {
      if (unmuteTimer) {
        clearTimeout(unmuteTimer);
        unmuteTimer = null;
      }
    }

    function showEndedBanner() {
      document.getElementById('endedBanner').classList.add('show');
    }
    function hideEndedBanner() {
      document.getElementById('endedBanner').classList.remove('show');
    }
    function setStatus(text, type = 'warn') {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = 'status ' + type;
    }
    function log(msg) {
      const box = document.getElementById('logBox');
      const time = new Date().toLocaleTimeString('tr-TR');
      const div = document.createElement('div');
      div.innerHTML = `<span class="time">${time}</span>${msg}`;
      box.prepend(div);
    }
    function clearLog() {
      document.getElementById('logBox').innerHTML = '';
      log('Log temizlendi');
      console.clear();
    }

    if (typeof YT !== 'undefined' && YT.Player) {
      onYouTubeIframeAPIReady();
    }
  </script>
</body>
</html>
