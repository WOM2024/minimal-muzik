<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>SkipCut Test v3 - Autoplay Fix (Muted)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 6px; color: #f84545; }
    .info { color: #aaa; font-size: 0.9rem; margin-bottom: 18px; text-align: center; max-width: 700px; }
    .player-wrapper {
      width: 100%;
      max-width: 960px;
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .player-wrapper::before {
      content: '';
      display: block;
      padding-top: 56.25%;
    }
    #player {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    .unmute-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    .unmute-overlay.hidden { opacity: 0; pointer-events: none; }
    .unmute-btn {
      background: #f84545;
      color: white;
      border: none;
      padding: 16px 28px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(248,69,69,0.4);
    }
    .unmute-btn:hover { background: #d63a3a; transform: scale(1.05); }
    .controls {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #f84545;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { background: #d63a3a; }
    button.secondary { background: #333; }
    button.secondary:hover { background: #444; }
    .status {
      margin-top: 16px;
      padding: 12px 16px;
      background: #1a1a1a;
      border-radius: 8px;
      font-size: 0.95rem;
      max-width: 960px;
      width: 100%;
      text-align: center;
      transition: all 0.3s;
    }
    .status.ok { border-left: 4px solid #4caf50; }
    .status.warn { border-left: 4px solid #ff9800; }
    .status.ended { 
      border-left: 4px solid #f84545; 
      background: #2a1515;
      font-weight: 600;
      font-size: 1.05rem;
    }
    .log-box {
      margin-top: 16px;
      max-width: 960px;
      width: 100%;
      background: #1a1a1a;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.85rem;
      color: #bbb;
      max-height: 200px;
      overflow-y: auto;
    }
    .log-box div { padding: 3px 0; border-bottom: 1px solid #222; }
    .log-box .time { color: #888; margin-right: 8px; }
    .ended-banner {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: linear-gradient(135deg, #f84545, #d63a3a);
      border-radius: 12px;
      text-align: center;
      max-width: 960px;
      width: 100%;
      animation: pulse 1.5s infinite;
    }
    .ended-banner.show { display: block; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    .console-hint {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Video Bitiş + Autoplay (Muted)</h1>
  <div class="info">
    Video: <strong>YWp89_AlpTQ</strong><br>
    Sayfa açılınca <strong>sessiz</strong> autoplay başlar. Sesi açmak için ortadaki butona tıkla.
  </div>

  <div class="player-wrapper">
    <div id="player"></div>
    <!-- Sesi aç overlay -->
    <div id="unmuteOverlay" class="unmute-overlay" onclick="unmuteVideo()">
      <button class="unmute-btn">
        🔊 Sesi Aç
      </button>
    </div>
  </div>

  <div class="controls">
    <button onclick="loadVideo()">Yeniden Başlat</button>
    <button class="secondary" onclick="player && player.pauseVideo()">Duraklat</button>
    <button class="secondary" onclick="player && player.playVideo()">Oynat</button>
    <button class="secondary" onclick="unmuteVideo()">Sesi Aç</button>
    <button class="secondary" onclick="clearLog()">Logu Temizle</button>
  </div>

  <div id="status" class="status warn">
    Player yükleniyor...
  </div>

  <div id="endedBanner" class="ended-banner">
    🎬 VİDEO BİTTİ!
    <div style="font-size:0.9rem; margin-top:8px; opacity:0.9;">
      Konsola da yazıldı → F12 ile kontrol edebilirsin
    </div>
  </div>

  <div class="log-box" id="logBox">
    <div><span class="time">--:--:--</span> Sistem hazır, player bekleniyor...</div>
  </div>

  <div class="console-hint">
    Konsolu açmak için: <strong>F12</strong> → Console
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const VIDEO_ID = 'YWp89_AlpTQ';
    let player = null;
    let hasEnded = false;
    let isMuted = true;

    function onYouTubeIframeAPIReady() {
      console.log('%c[SkipCut] YouTube IFrame API hazır', 'color: #4caf50; font-weight: bold');
      
      player = new YT.Player('player', {
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 1,
          mute: 1,              // Sessiz başlat → tarayıcı autoplay'e izin verir
          controls: 1,
          modestbranding: 1,
          rel: 0,
          iv_load_policy: 3,
          fs: 1,
          playsinline: 1,
          enablejsapi: 1,
          origin: window.location.origin
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      setStatus('Player hazır · Sessiz autoplay başladı', 'ok');
      log('Player hazır · Sessiz autoplay aktif');
      
      console.log('%c[SkipCut] Player hazır', 'color: #4caf50; font-weight: bold');
      console.log('[SkipCut] Video ID:', VIDEO_ID);
      console.log('[SkipCut] Autoplay: true (muted)');
      
      hasEnded = false;
      hideEndedBanner();

      // Zorla oynat (muted olduğu için çoğu tarayıcı izin verir)
      try {
        event.target.mute();
        event.target.playVideo();
        console.log('[SkipCut] playVideo() çağrıldı (muted)');
      } catch (e) {
        console.warn('[SkipCut] playVideo hatası:', e);
      }
    }

    function onPlayerStateChange(event) {
      const state = event.data;
      const stateNames = {
        '-1': 'UNSTARTED',
        '0': 'ENDED',
        '1': 'PLAYING',
        '2': 'PAUSED',
        '3': 'BUFFERING',
        '5': 'CUED'
      };
      const stateName = stateNames[state] || state;

      console.log(`%c[SkipCut] State → ${stateName} (${state})`, 'color: #2196f3');

      if (state === YT.PlayerState.ENDED) {
        hasEnded = true;
        setStatus('🎬 VİDEO BİTTİ (ENDED)', 'ended');
        showEndedBanner();
        log('✅ VİDEO BİTTİ → YT.PlayerState.ENDED');

        console.log('%c[SkipCut] 🎬 VİDEO BİTTİ!', 'color: #f84545; font-size: 14px; font-weight: bold');
        console.log('[SkipCut] Event data:', {
          state: state,
          stateName: 'ENDED',
          videoId: VIDEO_ID,
          timestamp: new Date().toISOString()
        });

        onVideoEnded();
      }
      else if (state === YT.PlayerState.PLAYING) {
        setStatus(isMuted ? 'Oynatılıyor (sessiz) · Sesi açmak için butona tıkla' : 'Oynatılıyor (sesli)', 'ok');
        log('▶️ Oynatılıyor (PLAYING)' + (isMuted ? ' [muted]' : ''));
        if (hasEnded) {
          hasEnded = false;
          hideEndedBanner();
        }
      }
      else if (state === YT.PlayerState.PAUSED) {
        setStatus('Duraklatıldı', 'warn');
        log('⏸️ Duraklatıldı (PAUSED)');
      }
      else if (state === YT.PlayerState.BUFFERING) {
        log('⏳ Buffering...');
      }
    }

    function onPlayerError(event) {
      setStatus('Hata: ' + event.data, 'warn');
      log('❌ Hata kodu: ' + event.data);
      console.error('[SkipCut] Player hatası:', event.data);
    }

    function onVideoEnded() {
      const endData = {
        event: 'video_ended',
        videoId: VIDEO_ID,
        timestamp: new Date().toISOString(),
        message: 'Video başarıyla sona erdi'
      };

      console.log('%c[SkipCut] onVideoEnded() çağrıldı', 'color: #f84545; font-weight: bold');
      console.table(endData);
      console.log('[SkipCut] Ham veri:', endData);
    }

    function unmuteVideo() {
      if (!player) return;
      try {
        player.unMute();
        player.setVolume(100);
        isMuted = false;
        document.getElementById('unmuteOverlay').classList.add('hidden');
        setStatus('Oynatılıyor (sesli)', 'ok');
        log('🔊 Ses açıldı');
        console.log('[SkipCut] Ses açıldı (unMute)');
      } catch (e) {
        console.warn('[SkipCut] unMute hatası:', e);
      }
    }

    function loadVideo() {
      if (!player) return;
      hasEnded = false;
      isMuted = true;
      hideEndedBanner();
      document.getElementById('unmuteOverlay').classList.remove('hidden');
      
      player.loadVideoById({
        videoId: VIDEO_ID,
        startSeconds: 0
      });
      // Yeniden yüklerken de muted başlat
      setTimeout(() => {
        try {
          player.mute();
          player.playVideo();
        } catch(e) {}
      }, 300);

      setStatus('Video yeniden yükleniyor (sessiz)...', 'warn');
      log('🔄 Video yeniden yüklendi');
      console.log('[SkipCut] Video yeniden yüklendi:', VIDEO_ID);
    }

    function showEndedBanner() {
      document.getElementById('endedBanner').classList.add('show');
    }

    function hideEndedBanner() {
      document.getElementById('endedBanner').classList.remove('show');
    }

    function setStatus(text, type = 'warn') {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = 'status ' + type;
    }

    function log(msg) {
      const box = document.getElementById('logBox');
      const now = new Date();
      const time = now.toLocaleTimeString('tr-TR');
      const div = document.createElement('div');
      div.innerHTML = `<span class="time">${time}</span>${msg}`;
      box.prepend(div);
    }

    function clearLog() {
      document.getElementById('logBox').innerHTML = '';
      log('Log temizlendi');
      console.clear();
      console.log('[SkipCut] Log temizlendi');
    }

    if (typeof YT !== 'undefined' && YT.Player) {
      onYouTubeIframeAPIReady();
    } else {
      console.log('[SkipCut] YouTube IFrame API bekleniyor...');
    }
  </script>
</body>
</html>
