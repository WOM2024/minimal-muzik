<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Özel Kalite Kontrollü Oynatıcı</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f0f0f;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .player-wrapper {
      width: 100%;
      max-width: 800px;
      background: #1f1f1f;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    /* Sizin İstediğiniz Üst Kalite Butonları */
    .custom-quality-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: #2a2a2a;
      padding: 10px 15px;
      border-radius: 8px;
    }
    .quality-label {
      font-size: 14px;
      font-weight: bold;
      color: #aaa;
    }
    .quality-btns {
      display: flex;
      gap: 6px;
    }
    .q-btn {
      background: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: 0.2s;
    }
    .q-btn:hover {
      background: #ff0000;
      border-color: #ff0000;
    }
    .q-btn.active {
      background: #ff0000;
      border-color: #ff0000;
    }

    /* Video Çerçevesi */
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Oranı */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none; /* YouTube'un kendi kontrollerine tıklanmasını engeller */
    }

    /* Alt Özel Kontrol Paneli (Oynat/Durdur) */
    .custom-controls {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .control-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .control-btn:hover {
      background: #444;
    }
  </style>
</head>
<body>

  <div class="player-wrapper">
    
    <!-- Üst Kalite Seçim Butonları -->
    <div class="custom-quality-bar">
      <span class="quality-label">Görüntü Kalitesi:</span>
      <div class="quality-btns">
        <button class="q-btn" onclick="setVideoQuality('hd1080', this)">1080p</button>
        <button class="q-btn" onclick="setVideoQuality('hd720', this)">720p</button>
        <button class="q-btn" onclick="setVideoQuality('large', this)">480p</button>
        <button class="q-btn" onclick="setVideoQuality('medium', this)">360p</button>
        <button class="q-btn active" onclick="setVideoQuality('auto', this)">Otomatik</button>
      </div>
    </div>

    <!-- Video Alanı -->
    <div class="video-container">
      <div id="yt-player"></div>
    </div>

    <!-- Alt Temel Kontroller -->
    <div class="custom-controls">
      <button class="control-btn" onclick="togglePlay()">Oynat / Durdur</button>
    </div>

  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player;
    var videoId = '_NoTqg152B0'; // Kendi video ID'nizi buraya yazabilirsiniz

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        videoId: videoId,
        playerVars: {
          'autoplay': 0,
          'controls': 0,         // YouTube'un kendi çarkını ve tüm çubuğunu gizler
          'disablekb': 1,        // Klavye kısayollarını kapatır
          'modestbranding': 1,
          'rel': 0,
          'iv_load_policy': 3
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function onPlayerReady(event) {
      console.log("Özel oynatıcı hazır.");
    }

    // Kalite Değiştirme Fonksiyonu
    function setVideoQuality(qualityLevel, btnElement) {
      if (player && typeof player.setPlaybackQuality === 'function') {
        player.setPlaybackQuality(qualityLevel);
        
        // Butonların aktiflik durumunu güncelle
        var buttons = document.querySelectorAll('.q-btn');
        buttons.forEach(function(b) { b.classList.remove('active'); });
        if (btnElement) btnElement.classList.add('active');
        
        console.log("Kalite komutu gönderildi: " + qualityLevel);
      }
    }

    // Oynat / Durdur Butonu
    function togglePlay() {
      if (player) {
        var state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
          player.pauseVideo();
        } else {
          player.playVideo();
        }
      }
    }
  </script>

</body>
</html>
