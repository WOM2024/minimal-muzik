<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Local Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Oranı */
      height: 0;
      overflow: hidden;
      border-radius: 6px;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>YouTube Local Sunucu Testi</h3>
    <div class="video-container">
      <!-- 
        ÖNEMLİ: origin parametresi tarayıcıda girdiğiniz adresle (http://localhost:8000) 
        birebir aynı olmalıdır!
      -->
      <iframe 
        id="existing-iframe-example"
        src="https://www.youtube.com/embed/_NoTqg152B0?enablejsapi=1&origin=http://localhost:8000"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>
    </div>
  </div>

  <!-- YouTube IFrame API Script'i -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('existing-iframe-example', {
        events: {
          'onReady': function(event) {
            console.log("Oynatıcı başarıyla yüklendi ve hazır!");
          }
        }
      });
    }
  </script>

</body>
</html>
