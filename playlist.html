<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Playlist</title>
  <link rel="icon" type="image/x-icon" href="superyt-logo.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; width: 100%;
      background: #0a0a0a; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; touch-action: manipulation;
    }
    body { display: flex; flex-direction: column; }

    .header {
      flex-shrink: 0;
      padding: 8px 14px 9px;
      border-bottom: 1px solid #1f1f1f;
      background: #0a0a0a;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .header-logo {
      width: 65px;
      height: 40px;
      display: block;
      object-fit: contain;
      object-position: center;
      background: transparent;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 15px; font-weight: 600; color: #eee;
      display: flex; align-items: center; gap: 8px;
      min-width: 0;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #555; flex-shrink: 0;
    }
    .status-dot.on { background: #3dd68c; box-shadow: 0 0 8px rgba(61,214,140,0.5); }
    .status-dot.wait { background: #f5a623; }
    .sub { font-size: 12px; color: #777; margin-top: 4px; }

    #connectScreen {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; gap: 16px;
    }
    #connectScreen.hidden { display: none; }
    .connect-title { font-size: 18px; font-weight: 600; color: #eee; }
    .connect-hint { font-size: 13px; color: #888; text-align: center; line-height: 1.4; max-width: 280px; }
    #codeInput {
      width: 100%; max-width: 220px; height: 52px;
      background: #1c1c1c; border: 1px solid #333; border-radius: 12px;
      color: #fff; font-size: 22px; letter-spacing: 6px; text-align: center;
      outline: none; text-transform: uppercase;
    }
    #codeInput:focus { border-color: #3ea6ff; }
    #joinBtn {
      width: 100%; max-width: 220px; height: 48px;
      background: #3ea6ff; color: #000; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
    #joinBtn:active { opacity: 0.85; }
    .err { color: #ff6b6b; font-size: 13px; min-height: 18px; }

    #mainScreen {
      flex: 1; display: none; flex-direction: column; min-height: 0;
    }
    #mainScreen.show { display: flex; }

    .mode-bar {
      flex-shrink: 0;
      display: flex; gap: 6px;
      padding: 10px 12px 6px;
    }
    .mode-btn {
      flex: 1; height: 40px;
      background: #1c1c1c; border: 1px solid #333; border-radius: 10px;
      color: #aaa; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .mode-btn.active {
      background: #3ea6ff; color: #000; border-color: #3ea6ff;
    }

    .now-box {
      flex-shrink: 0;
      margin: 6px 12px 8px;
      padding: 12px 14px;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
    }
    .now-label {
      font-size: 11px; color: #3ea6ff; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 600;
    }
    .now-title {
      font-size: 15px; font-weight: 600; color: #f0f0f0;
      line-height: 1.3; margin-bottom: 2px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .now-author { font-size: 12px; color: #888; }

    .controls {
      flex-shrink: 0;
      display: flex; gap: 10px; padding: 4px 12px 10px;
    }
    .controls button {
      flex: 1; height: 46px;
      background: #1c1c1c; border: 1px solid #333; border-radius: 12px;
      color: #fff; font-size: 20px; cursor: pointer;
    }
    .controls button:active { background: #3ea6ff; color: #000; border-color: #3ea6ff; }

    .search-bar {
      flex-shrink: 0;
      display: none;
      gap: 8px;
      padding: 0 12px 8px;
    }
    .search-bar.show { display: flex; }
    #plSearch {
      flex: 1; height: 42px;
      background: #1c1c1c; border: 1px solid #333; border-radius: 10px;
      color: #fff; font-size: 15px; padding: 0 12px; outline: none;
    }
    #plSearch:focus { border-color: #3ea6ff; }
    #plSearchBtn {
      width: 52px; height: 42px;
      background: #3ea6ff; color: #000; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }

    .cats {
      flex-shrink: 0;
      display: none;
      gap: 6px;
      padding: 0 10px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cats.show { display: flex; }
    .cats::-webkit-scrollbar { display: none; }
    .cat {
      flex-shrink: 0;
      padding: 6px 12px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 20px;
      font-size: 12px;
      color: #ccc;
      cursor: pointer;
      white-space: nowrap;
    }
    .cat.active, .cat:active {
      background: #3ea6ff;
      color: #000;
      border-color: #3ea6ff;
    }

    .tabs {
      flex-shrink: 0;
      display: none;
      gap: 0;
      padding: 0 12px;
      border-bottom: 1px solid #1f1f1f;
    }
    .tabs.show { display: flex; }
    .tab {
      flex: 1; padding: 10px 0;
      text-align: center; font-size: 12px; font-weight: 600;
      color: #777; cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab.active { color: #3ea6ff; border-bottom-color: #3ea6ff; }

    .list-label {
      flex-shrink: 0;
      padding: 8px 14px 6px;
      font-size: 12px; color: #666; font-weight: 600;
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    }
    .list-label button {
      padding: 4px 10px; font-size: 11px;
      background: #1a3a2a; color: #3dd68c;
      border: none; border-radius: 8px; cursor: pointer; font-weight: 600;
    }

    .scroll-area {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 0 10px 16px;
      min-height: 0;
    }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .q-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 8px; border-radius: 10px;
      cursor: pointer; border: 1px solid transparent;
      margin-bottom: 4px;
    }
    .q-item:active { background: #1a1a1a; }
    .q-item.playing {
      background: rgba(62, 166, 255, 0.12);
      border-color: rgba(62, 166, 255, 0.35);
    }
    .q-num {
      width: 22px; text-align: center;
      font-size: 12px; color: #555; flex-shrink: 0;
    }
    .q-item.playing .q-num { color: #3ea6ff; }
    .q-info { flex: 1; min-width: 0; }
    .q-title {
      font-size: 13px; font-weight: 500; color: #e0e0e0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .q-item.playing .q-title { color: #3ea6ff; }
    .q-author {
      font-size: 11px; color: #777;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 2px;
    }
    .q-actions {
      display: flex; gap: 4px; flex-shrink: 0;
    }
    .q-actions button {
      min-width: 36px; height: 36px; padding: 0 8px;
      border: none; border-radius: 8px;
      font-size: 14px; cursor: pointer;
      background: #222; color: #ccc;
      font-weight: 600;
    }
    .q-actions button.add { background: #1a3a2a; color: #3dd68c; }
    .q-actions button.rm { background: #3a1a1a; color: #ff6b6b; }
    .q-actions button.import {
      background: #1a2a3a; color: #3ea6ff; font-size: 12px;
      min-width: auto; padding: 0 10px;
    }
    .q-actions button:active { opacity: 0.75; }

    .pl-card {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 10px; border-radius: 12px;
      background: #141414; border: 1px solid #222;
      margin-bottom: 8px; cursor: pointer;
    }
    .pl-card:active { border-color: #3ea6ff; background: #1a1a1a; }
    .pl-icon {
      width: 48px; height: 48px; border-radius: 8px;
      background: linear-gradient(135deg, #3ea6ff33, #ff2d5533);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .pl-info { flex: 1; min-width: 0; }
    .pl-title {
      font-size: 14px; font-weight: 600; color: #f0f0f0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pl-meta {
      font-size: 11px; color: #888; margin-top: 3px;
    }
    .pl-import {
      flex-shrink: 0;
      padding: 8px 12px;
      background: #3ea6ff; color: #000;
      border: none; border-radius: 10px;
      font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .pl-import:active { opacity: 0.85; }
    .pl-import:disabled { opacity: 0.5; pointer-events: none; }

    .empty-q, .loading-q {
      text-align: center; color: #555; font-size: 13px; padding: 36px 16px; line-height: 1.5;
    }
    .loading-q { color: #666; }

    .footer {
      flex-shrink: 0;
      padding: 8px 14px 12px;
      border-top: 1px solid #1a1a1a;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: #666;
    }
    .footer button {
      background: none; border: 1px solid #333; color: #999;
      padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
    }
    .footer button:active { border-color: #3ea6ff; color: #3ea6ff; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-brand">
      <img class="header-logo" src="superyt-logo.png" alt="SuperYT" />
      <h1>
        <span class="status-dot" id="statusDot"></span>
        Playlist
      </h1>
    </div>
    <div class="sub" id="statusText">Bağlantı bekleniyor…</div>
  </div>

  <div id="connectScreen">
    <div class="connect-title">Bağlantı kodu</div>
    <div class="connect-hint">
      Ana uygulamadaki (index) 6 haneli kodu gir.<br>
      Aynı telefonda veya başka cihazda çalışır.
    </div>
    <input id="codeInput" type="text" maxlength="6" placeholder="A3K9X2" autocomplete="off" autocapitalize="characters" />
    <button id="joinBtn" type="button">Bağlan</button>
    <div class="err" id="joinErr"></div>
  </div>

  <div id="mainScreen">
    <div class="mode-bar">
      <button type="button" class="mode-btn active" id="modeShuffle" data-mode="shuffle">🔀 Shuffle</button>
      <button type="button" class="mode-btn" id="modeManual" data-mode="manual">✋ Manuel</button>
    </div>

    <div class="now-box">
      <div class="now-label">Şimdi çalıyor</div>
      <div class="now-title" id="nowTitle">—</div>
      <div class="now-author" id="nowAuthor">—</div>
    </div>

    <div class="controls">
      <button type="button" id="prevBtn" title="Önceki">⏮</button>
      <button type="button" id="nextBtn" title="Sonraki">⏭</button>
    </div>

    <div class="search-bar" id="searchBar">
      <input id="plSearch" type="search" placeholder="Ara…" enterkeyhint="search" />
      <button type="button" id="plSearchBtn">Ara</button>
    </div>

    <div class="cats" id="plCats">
      <div class="cat" data-cat="turkce-pop">Türkçe Pop</div>
      <div class="cat" data-cat="turkce-rock">Türkçe Rock</div>
      <div class="cat" data-cat="arabesk">Arabesk</div>
      <div class="cat" data-cat="rap">Rap</div>
      <div class="cat" data-cat="slow">Slow</div>
      <div class="cat" data-cat="yabanci-pop">Yabancı Pop</div>
      <div class="cat" data-cat="klasik">Klasik</div>
      <div class="cat" data-cat="lofi">Lofi</div>
      <div class="cat" data-cat="populer">Popüler</div>
    </div>

    <div class="tabs" id="tabsBar">
      <div class="tab active" data-tab="playlist">Playlistim</div>
      <div class="tab" data-tab="ready">Youtube Playlist</div>
      <div class="tab" data-tab="search">Şarkı ara</div>
    </div>

    <div class="list-label" id="listLabel">Sıradaki şarkılar</div>
    <div class="scroll-area" id="scrollArea"></div>

    <div class="footer">
      <span id="roomLabel">Kod: —</span>
      <button type="button" id="disconnectBtn">Bağlantıyı kes</button>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const ROOM_PREFIX = "mm-";
    const STORAGE_KEY = "minimal_muzik_sync";
    const BC_NAME = "minimal_muzik_bc";
    const SEARCH_INSTANCES = ["https://invidious.f5.si"];
    const MANUAL_KEY = "minimal_muzik_manual_pl";

        { playlistId: "PL4fGSI1pDJn5tdVDtIAZArERm_vv4uFCR", title: "Top 100 Songs — Türkiye", author: YT_CHARTS_AUTHOR, videoCount: 100 },
        { playlistId: "PL4fGSI1pDJn6rnJKpaAkK1XK8QUfa9KqP", title: "Top 100 Music Videos — Türkiye", author: YT_CHARTS_AUTHOR, videoCount: 100 },
        { playlistId: "PL4fGSI1pDJn6K25Wo9fqy6bQLluWfvC61", title: "Daily Top Music Videos — Türkiye", author: YT_CHARTS_AUTHOR, videoCount: 100 }

      ],
      "rap": [
        { playlistId: "PL4fGSI1pDJn5tdVDtIAZArERm_vv4uFCR", title: "Top 100 Songs — Türkiye", author: YT_CHARTS_AUTHOR, videoCount: 100 },
        { playlistId: "PL4fGSI1pDJn59hyJwXYE-_65OUiNdtnjO", title: "Daily Top Songs on Shorts — Türkiye", author: YT_CHARTS_AUTHOR, videoCount: 50 }
      ],
      "slow": [
        { playlistId: "PL4fGSI1pDJn5tdVDtIAZArERm_vv4uFCR", title: "Top 100 Songs — Türkiye", author: YT_CHARTS_AUTHOR, videoCount: 100 }
      ],
      "yabanci-pop": [
        { playlistId: "PL4fGSI1pDJn5kI81J1fYWK5eZRl1zJ5kM", title: "Top 100 Music Videos — Global", author: YT_CHARTS_AUTHOR, videoCount: 100 },
        { playlistId: "PL4fGSI1pDJn6t3TXLGiiJdD-sZbrG3tG0", title: "Daily Top Music Videos — Global", author: YT_CHARTS_AUTHOR, videoCount: 100 },
        { playlistId: "PL4fGSI1pDJn50iCQRUVmgUjOrCggCQ9nR", title: "Top 100 Music Videos — France", author: YT_CHARTS_AUTHOR, videoCount: 100 },
        { playlistId: "PL4fGSI1pDJn5BPviUFX4a3IMnAgyknC68", title: "Top 100 Music Videos — Italy", author: YT_CHARTS_AUTHOR, videoCount: 100 }
      ],
      "klasik": [
        { playlistId: "PL4fGSI1pDJn5kI81J1fYWK5eZRl1zJ5kM", title: "Top 100 Music Videos — Global", author: YT_CHARTS_AUTHOR, videoCount: 100 }
      ],
      "lofi": [
        { playlistId: "PL4fGSI1pDJn6t3TXLGiiJdD-sZbrG3tG0", title: "Daily Top Music Videos — Global", author: YT_CHARTS_AUTHOR, videoCount: 100 }
      ]
    };

    // Tür araması ile ek playlist keşfi (sadece seçilen kategori sorgusu)
    const CATEGORY_PLAYLIST_SEARCH = {
      "turkce-pop": "türkçe pop playlist",
      "turkce-rock": "türkçe rock playlist",
      "arabesk": "arabesk playlist",
      "rap": "türkçe rap playlist",
      "slow": "slow şarkılar playlist",
      "yabanci-pop": "pop hits playlist 2025",
      "klasik": "classical music playlist",
      "lofi": "lofi hip hop playlist",
      "populer": "türkiye top 100 playlist"
    };

    let roomCode = "";
    let peer = null;
    let conn = null;
    let bc = null;
    let lastState = null;
    let pollTimer = null;

    let mode = "shuffle";
    let activeTab = "playlist"; // playlist | ready | search
    let manualQueue = [];
    let searchResults = [];
    let readyPlaylists = [];
    let searchLoading = false;
    let importing = false;

    const connectScreen = document.getElementById("connectScreen");
    const mainScreen = document.getElementById("mainScreen");
    const codeInput = document.getElementById("codeInput");
    const joinBtn = document.getElementById("joinBtn");
    const joinErr = document.getElementById("joinErr");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const nowTitle = document.getElementById("nowTitle");
    const nowAuthor = document.getElementById("nowAuthor");
    const scrollArea = document.getElementById("scrollArea");
    const listLabel = document.getElementById("listLabel");
    const roomLabel = document.getElementById("roomLabel");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const searchBar = document.getElementById("searchBar");
    const tabsBar = document.getElementById("tabsBar");
    const plSearch = document.getElementById("plSearch");
    const plSearchBtn = document.getElementById("plSearchBtn");
    const plCats = document.getElementById("plCats");
    const modeShuffle = document.getElementById("modeShuffle");
    const modeManual = document.getElementById("modeManual");

    (function() {
      var params = new URLSearchParams(location.search);
      var c = (params.get("c") || params.get("code") || "").trim().toUpperCase();
      if (c.length >= 4) {
        codeInput.value = c.slice(0, 6);
        setTimeout(function() { joinRoom(c.slice(0, 6)); }, 300);
      }
    })();

    function loadManual() {
      try { manualQueue = JSON.parse(localStorage.getItem(MANUAL_KEY) || "[]"); }
      catch (e) { manualQueue = []; }
    }
    function saveManual() {
      try { localStorage.setItem(MANUAL_KEY, JSON.stringify(manualQueue)); }
      catch (e) {}
    }
    loadManual();

    function setStatus(modeS, text) {
      statusDot.className = "status-dot" + (modeS === "on" ? " on" : modeS === "wait" ? " wait" : "");
      statusText.textContent = text;
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function isInManual(id) {
      return manualQueue.some(function(x) { return x.id === id; });
    }

    function setMode(m) {
      mode = m;
      modeShuffle.classList.toggle("active", m === "shuffle");
      modeManual.classList.toggle("active", m === "manual");
      searchBar.classList.toggle("show", m === "manual");
      tabsBar.classList.toggle("show", m === "manual");
      if (plCats) plCats.classList.toggle("show", m === "manual");

      if (m === "shuffle") {
        listLabel.textContent = "Sıradaki şarkılar (ana uygulama)";
        activeTab = "playlist";
        sendCommand({ type: "setMode", mode: "shuffle" });
        renderList();
      } else {
        sendCommand({ type: "setMode", mode: "manual" });
        if (manualQueue.length) {
          sendCommand({ type: "setQueue", queue: manualQueue });
        }
        // İlk açılışta hazır listeleri göster
        activeTab = "ready";
        document.querySelectorAll(".tab").forEach(function(t) {
          t.classList.toggle("active", t.dataset.tab === activeTab);
        });
        loadReadyPlaylists("populer");
      }
    }

    function applyState(state) {
      if (!state) return;
      lastState = state;
      if (state.now && state.now.title) {
        nowTitle.textContent = state.now.title;
        nowAuthor.textContent = state.now.author || "YouTube";
      } else {
        nowTitle.textContent = "Şarkı seçilmedi";
        nowAuthor.textContent = "Hazır listeden seç veya ara";
      }
      renderList();
    }

    function renderList() {
      var currentId = lastState && lastState.now && lastState.now.id ? lastState.now.id : "";

      if (mode === "shuffle") {
        var queue = (lastState && lastState.queue) ? lastState.queue : [];
        listLabel.textContent = "Sıradaki şarkılar (ana uygulama)";
        if (!queue.length) {
          scrollArea.innerHTML = '<div class="empty-q">Liste boş.<br>Ana uygulamada kategori seç veya ara.</div>';
          return;
        }
        var html = "";
        for (var i = 0; i < queue.length; i++) {
          var item = queue[i];
          var isPlaying = item.id === currentId;
          html +=
            '<div class="q-item' + (isPlaying ? " playing" : "") + '" data-id="' + item.id + '">' +
            '<div class="q-num">' + (isPlaying ? "▶" : (i + 1)) + '</div>' +
            '<div class="q-info">' +
            '<div class="q-title">' + escapeHtml(item.title || "—") + '</div>' +
            '<div class="q-author">' + escapeHtml(item.author || "") + '</div>' +
            '</div></div>';
        }
        scrollArea.innerHTML = html;
        scrollArea.querySelectorAll(".q-item").forEach(function(el) {
          el.addEventListener("click", function() {
            sendCommand({ type: "play", id: el.dataset.id });
          });
        });
        return;
      }

      // —— Manuel: Playlistim ——
      if (activeTab === "playlist") {
        listLabel.innerHTML = "Playlistim (" + manualQueue.length + ")" +
          (manualQueue.length
            ? ' <button type="button" id="clearPlBtn">Temizle</button>'
            : "");
        if (!manualQueue.length) {
          scrollArea.innerHTML = '<div class="empty-q">Liste boş.<br>«Hazır listeler»den bir playlist seç — tüm şarkılar buraya gelir.</div>';
          return;
        }
        var htmlP = "";
        for (var p = 0; p < manualQueue.length; p++) {
          var itemP = manualQueue[p];
          var isPlayingP = itemP.id === currentId;
          htmlP +=
            '<div class="q-item' + (isPlayingP ? " playing" : "") + '">' +
            '<div class="q-num">' + (isPlayingP ? "▶" : (p + 1)) + '</div>' +
            '<div class="q-info" data-play="' + itemP.id + '">' +
            '<div class="q-title">' + escapeHtml(itemP.title || "—") + '</div>' +
            '<div class="q-author">' + escapeHtml(itemP.author || "") + '</div>' +
            '</div>' +
            '<div class="q-actions">' +
            '<button type="button" class="rm" data-rm="' + itemP.id + '" title="Çıkar">✕</button>' +
            '</div></div>';
        }
        scrollArea.innerHTML = htmlP;
        scrollArea.querySelectorAll("[data-rm]").forEach(function(btn) {
          btn.addEventListener("click", function(e) {
            e.stopPropagation();
            removeFromManual(btn.dataset.rm);
          });
        });
        scrollArea.querySelectorAll("[data-play]").forEach(function(el) {
          el.addEventListener("click", function() {
            sendCommand({ type: "play", id: el.dataset.play });
          });
        });
        var clearBtn = document.getElementById("clearPlBtn");
        if (clearBtn) {
          clearBtn.addEventListener("click", function() {
            if (!confirm("Playlist temizlensin mi?")) return;
            manualQueue = [];
            saveManual();
            sendCommand({ type: "setQueue", queue: [] });
            renderList();
          });
        }
        return;
      }

      // —— Hazır YouTube playlistleri ——
      if (activeTab === "ready") {
        listLabel.textContent = importing
          ? "İçe aktarılıyor…"
          : "YouTube Music resmi listeleri — seç, tüm şarkılar eklenir";
        if (searchLoading) {
          scrollArea.innerHTML = '<div class="loading-q">Playlistler yükleniyor…</div>';
          return;
        }
        if (!readyPlaylists.length) {
          scrollArea.innerHTML = '<div class="empty-q">Kategori seç → o bölge/türe göre YouTube Music listeleri gelsin.<br>Listeye basınca tüm şarkılar eklenir.</div>';
          return;
        }
        var htmlR = "";
        for (var r = 0; r < readyPlaylists.length; r++) {
          var pl = readyPlaylists[r];
          htmlR +=
            '<div class="pl-card" data-plid="' + escapeHtml(pl.playlistId) + '">' +
            '<div class="pl-icon">🎵</div>' +
            '<div class="pl-info">' +
            '<div class="pl-title">' + escapeHtml(pl.title || "Playlist") + '</div>' +
            '<div class="pl-meta">' +
            (pl.videoCount ? pl.videoCount + " şarkı" : "") +
            (pl.author ? " · " + escapeHtml(pl.author) : "") +
            '</div></div>' +
            '<button type="button" class="pl-import" data-import="' + r + '">Ekle</button>' +
            '</div>';
        }
        scrollArea.innerHTML = htmlR;
        scrollArea.querySelectorAll("[data-import]").forEach(function(btn) {
          btn.addEventListener("click", function(e) {
            e.stopPropagation();
            var idx = parseInt(btn.dataset.import, 10);
            var pl = readyPlaylists[idx];
            if (pl) importFullPlaylist(pl.playlistId, pl.title, btn);
          });
        });
        scrollArea.querySelectorAll(".pl-card").forEach(function(card) {
          card.addEventListener("click", function(e) {
            if (e.target.closest("[data-import]")) return;
            var btn = card.querySelector("[data-import]");
            if (btn) btn.click();
          });
        });
        return;
      }

      // —— Şarkı arama ——
      listLabel.textContent = "Şarkı sonuçları";
      if (searchLoading) {
        scrollArea.innerHTML = '<div class="loading-q">Aranıyor…</div>';
        return;
      }
      if (!searchResults.length) {
        scrollArea.innerHTML = '<div class="empty-q">Şarkı adı yazıp ara.<br>Veya «Hazır listeler»den playlist seç.</div>';
        return;
      }
      var htmlS = "";
      for (var s = 0; s < searchResults.length; s++) {
        var it = searchResults[s];
        var added = isInManual(it.id);
        var isPlay = it.id === currentId;
        htmlS +=
          '<div class="q-item' + (isPlay ? " playing" : "") + '">' +
          '<div class="q-num">' + (s + 1) + '</div>' +
          '<div class="q-info" data-play="' + it.id + '">' +
          '<div class="q-title">' + escapeHtml(it.title || "—") + '</div>' +
          '<div class="q-author">' + escapeHtml(it.author || "") + '</div>' +
          '</div>' +
          '<div class="q-actions">';
        if (added) {
          htmlS += '<button type="button" class="rm" data-rm="' + it.id + '">✕</button>';
        } else {
          htmlS += '<button type="button" class="add" data-add="' + s + '">＋</button>';
        }
        htmlS += '</div></div>';
      }
      scrollArea.innerHTML = htmlS;
      scrollArea.querySelectorAll("[data-add]").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          var item = searchResults[parseInt(btn.dataset.add, 10)];
          if (!item || isInManual(item.id)) return;
          manualQueue.push({ id: item.id, title: item.title || "", author: item.author || "" });
          saveManual();
          sendCommand({ type: "setQueue", queue: manualQueue });
          renderList();
        });
      });
      scrollArea.querySelectorAll("[data-rm]").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          removeFromManual(btn.dataset.rm);
        });
      });
      scrollArea.querySelectorAll("[data-play]").forEach(function(el) {
        el.addEventListener("click", function() {
          var id = el.dataset.play;
          var found = searchResults.filter(function(x) { return x.id === id; })[0];
          if (found && !isInManual(id)) {
            manualQueue.push({ id: found.id, title: found.title || "", author: found.author || "" });
            saveManual();
            sendCommand({ type: "setQueue", queue: manualQueue });
          }
          sendCommand({ type: "play", id: id, title: found ? found.title : "", author: found ? found.author : "" });
        });
      });
    }

    function removeFromManual(id) {
      manualQueue = manualQueue.filter(function(x) { return x.id !== id; });
      saveManual();
      sendCommand({ type: "setQueue", queue: manualQueue });
      renderList();
    }

    async function fetchApi(path) {
      for (var i = 0; i < SEARCH_INSTANCES.length; i++) {
        try {
          var res = await fetch(SEARCH_INSTANCES[i] + path, {
            signal: AbortSignal.timeout(15000)
          });
          if (!res.ok) continue;
          return await res.json();
        } catch (e) {
          console.warn(e);
        }
      }
      return null;
    }

    async function importFullPlaylist(playlistId, title, btn) {
      if (importing || !playlistId) return;
      importing = true;
      if (btn) {
        btn.disabled = true;
        btn.textContent = "…";
      }
      listLabel.textContent = "İçe aktarılıyor: " + (title || "");

      var data = await fetchApi("/api/v1/playlists/" + encodeURIComponent(playlistId));
      importing = false;

      if (!data || !Array.isArray(data.videos) || !data.videos.length) {
        listLabel.textContent = "Playlist alınamadı, başka birini dene";
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Ekle";
        }
        return;
      }

      // Seçilen hazır playlist → mevcut listeyi değiştir (tam playlist aktarımı)
      var seen = {};
      var nextQueue = [];
      data.videos.forEach(function(v) {
        var id = v.videoId;
        if (!id || seen[id]) return;
        if (v.lengthSeconds && v.lengthSeconds < 45) return;
        seen[id] = true;
        nextQueue.push({
          id: id,
          title: v.title || "",
          author: v.author || data.author || ""
        });
      });
      var added = nextQueue.length;
      manualQueue = nextQueue;

      saveManual();
      sendCommand({ type: "setQueue", queue: manualQueue });

      // Playlistim sekmesine geç
      activeTab = "playlist";
      document.querySelectorAll(".tab").forEach(function(t) {
        t.classList.toggle("active", t.dataset.tab === "playlist");
      });
      renderList();

      // İlk şarkıyı otomatik çal
      if (added > 0 && manualQueue.length) {
        var first = manualQueue[0];
        // Eğer zaten bir şey çalmıyorsa veya yeni importsa baştan başlat
        sendCommand({ type: "play", id: first.id, title: first.title, author: first.author });
      }

      if (btn) {
        btn.disabled = false;
        btn.textContent = "Eklendi ✓";
      }
    }

    async function doSongSearch(q) {
      q = (q || "").trim();
      if (!q) return;
      searchLoading = true;
      activeTab = "search";
      document.querySelectorAll(".tab").forEach(function(t) {
        t.classList.toggle("active", t.dataset.tab === "search");
      });
      renderList();

      var data = await fetchApi(
        "/api/v1/search?q=" + encodeURIComponent(q) +
        "&type=video&page=1&region=TR&sort=views"
      );

      searchLoading = false;
      searchResults = [];
      if (Array.isArray(data)) {
        searchResults = data
          .filter(function(item) {
            return item.type === "video" && item.videoId &&
              (!item.lengthSeconds || item.lengthSeconds >= 60);
          })
          .slice(0, 30)
          .map(function(item) {
            return {
              id: item.videoId,
              title: item.title || "",
              author: item.author || ""
            };
          });
      }
      renderList();
    }



    async function loadReadyPlaylists(catKey) {
      catKey = catKey || "populer";
      searchLoading = true;
      activeTab = "ready";
      document.querySelectorAll(".tab").forEach(function(t) {
        t.classList.toggle("active", t.dataset.tab === "ready");
      });
      if (plCats) {
        plCats.querySelectorAll(".cat").forEach(function(c) {
          c.classList.toggle("active", c.dataset.cat === catKey);
        });
      }
      renderList();

      // 1) Bu kategoriye özel sabit resmi listeler
      var found = (CATEGORY_PLAYLISTS[catKey] || CATEGORY_PLAYLISTS["populer"] || []).map(function(p) {
        return {
          playlistId: p.playlistId,
          title: p.title,
          author: p.author || YT_CHARTS_AUTHOR,
          videoCount: p.videoCount || 0
        };
      });

      // 2) Aynı kategoride ek playlist ara (başlıkta kategori geçsin)
      var q = CATEGORY_PLAYLIST_SEARCH[catKey] || (catKey + " playlist");
      var data = await fetchApi(
        "/api/v1/search?q=" + encodeURIComponent(q) + "&type=playlist&page=1&region=TR"
      );

      var seen = {};
      found.forEach(function(p) { seen[p.playlistId] = true; });

      if (Array.isArray(data)) {
        data.forEach(function(item) {
          if (item.type !== "playlist" || !item.playlistId) return;
          if (seen[item.playlistId]) return;
          // Çok küçük listeleri atla
          if (item.videoCount && item.videoCount < 5) return;
          seen[item.playlistId] = true;
          found.push({
            playlistId: item.playlistId,
            title: item.title || "Playlist",
            author: item.author || "",
            videoCount: item.videoCount || 0
          });
        });
      }

      // Kategoriye özel: en fazla 12 liste göster
      readyPlaylists = found.slice(0, 12);
      searchLoading = false;
      renderList();
    }

    async function doSmartSearch(q) {
      q = (q || "").trim();
      if (!q) return;
      searchLoading = true;
      activeTab = "ready";
      document.querySelectorAll(".tab").forEach(function(t) {
        t.classList.toggle("active", t.dataset.tab === "ready");
      });
      renderList();

      var data = await fetchApi(
        "/api/v1/search?q=" + encodeURIComponent(q) + "&type=playlist&page=1&region=TR"
      );
      searchLoading = false;
      readyPlaylists = [];
      if (Array.isArray(data)) {
        readyPlaylists = data
          .filter(function(item) {
            return item.type === "playlist" && item.playlistId &&
              (!item.videoCount || item.videoCount >= 5);
          })
          .slice(0, 12)
          .map(function(item) {
            return {
              playlistId: item.playlistId,
              title: item.title || "Playlist",
              author: item.author || "",
              videoCount: item.videoCount || 0
            };
          });
      }
      renderList();
    }

    function sendCommand(cmd) {
      cmd.ts = Date.now();
      // Çalma ile ilgili her istekte index tarafında tam ekran zorlansın
      if (cmd && (cmd.type === "play" || cmd.type === "next" || cmd.type === "prev" || cmd.type === "setQueue")) {
        cmd.forceFs = true;
      }
      function push(msg) {
        try { if (bc) bc.postMessage({ kind: "cmd", room: roomCode, cmd: msg }); } catch (e) {}
        try {
          localStorage.setItem(STORAGE_KEY + "_cmd_" + roomCode, JSON.stringify(msg));
          localStorage.removeItem(STORAGE_KEY + "_cmd_" + roomCode);
        } catch (e) {}
        try { if (conn && conn.open) conn.send({ kind: "cmd", cmd: msg }); } catch (e) {}
      }
      push(cmd);
      // Ayrı fullscreen komutu — index handleRemoteCommand bunu da yakalar
      if (cmd && cmd.forceFs) {
        push({ type: "fullscreen", ts: Date.now() });
      }
    }

    function onStateMessage(state) {
      if (!state || state.room !== roomCode) return;
      applyState(state);
      setStatus("on", "Bağlı · canlı");
    }

    function startLocalSync() {
      try {
        bc = new BroadcastChannel(BC_NAME);
        bc.onmessage = function(ev) {
          var d = ev.data;
          if (!d) return;
          if (d.kind === "state" && d.room === roomCode) onStateMessage(d.state);
        };
      } catch (e) {}

      window.addEventListener("storage", function(ev) {
        if (ev.key === STORAGE_KEY + "_" + roomCode && ev.newValue) {
          try { onStateMessage(JSON.parse(ev.newValue)); } catch (e) {}
        }
      });

      try {
        var raw = localStorage.getItem(STORAGE_KEY + "_" + roomCode);
        if (raw) onStateMessage(JSON.parse(raw));
      } catch (e) {}

      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(function() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY + "_" + roomCode);
          if (!raw) return;
          var state = JSON.parse(raw);
          if (!lastState || state.updated !== lastState.updated) onStateMessage(state);
        } catch (e) {}
      }, 1500);
    }

    function startPeerClient() {
      if (typeof Peer === "undefined") return;
      try {
        peer = new Peer();
        peer.on("open", function() {
          var hostId = ROOM_PREFIX + roomCode.toLowerCase();
          conn = peer.connect(hostId, { reliable: true });
          conn.on("open", function() {
            setStatus("on", "Bağlı · uzaktan");
            conn.send({ kind: "hello", room: roomCode });
          });
          conn.on("data", function(data) {
            if (data && data.kind === "state") onStateMessage(data.state);
          });
          conn.on("close", function() {
            setStatus("wait", "Uzaktan koptu · yerel dinleniyor");
          });
        });
        peer.on("error", function() {
          setStatus("wait", "Yerel bağlantı aktif");
        });
      } catch (e) {
        setStatus("wait", "Yerel bağlantı aktif");
      }
    }

    function joinRoom(code) {
      code = (code || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (code.length < 4) {
        joinErr.textContent = "En az 4 karakter gir";
        return;
      }
      roomCode = code.slice(0, 6);
      joinErr.textContent = "";
      setStatus("wait", "Bağlanıyor…");
      connectScreen.classList.add("hidden");
      mainScreen.classList.add("show");
      roomLabel.textContent = "Kod: " + roomCode;
      startLocalSync();
      startPeerClient();
      setMode("shuffle");
    }

    function disconnect() {
      roomCode = "";
      lastState = null;
      if (bc) { try { bc.close(); } catch (e) {} bc = null; }
      if (conn) { try { conn.close(); } catch (e) {} conn = null; }
      if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      mainScreen.classList.remove("show");
      connectScreen.classList.remove("hidden");
      setStatus("", "Bağlantı bekleniyor…");
      codeInput.value = "";
      codeInput.focus();
    }

    joinBtn.addEventListener("click", function() { joinRoom(codeInput.value); });
    codeInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") joinRoom(codeInput.value);
    });
    prevBtn.addEventListener("click", function() { sendCommand({ type: "prev" }); });
    nextBtn.addEventListener("click", function() { sendCommand({ type: "next" }); });
    disconnectBtn.addEventListener("click", disconnect);

    modeShuffle.addEventListener("click", function() { setMode("shuffle"); });
    modeManual.addEventListener("click", function() { setMode("manual"); });

    function updateSearchPlaceholder() {
      if (!plSearch) return;
      if (activeTab === "search") {
        plSearch.placeholder = "Şarkı adı yaz…";
      } else if (activeTab === "ready") {
        plSearch.placeholder = "Playlist ara…";
      } else {
        plSearch.placeholder = "Playlist veya şarkı ara…";
      }
    }

    document.querySelectorAll(".tab").forEach(function(tab) {
      tab.addEventListener("click", function() {
        activeTab = tab.dataset.tab;
        document.querySelectorAll(".tab").forEach(function(t) {
          t.classList.toggle("active", t.dataset.tab === activeTab);
        });
        updateSearchPlaceholder();
        if (activeTab === "ready" && !readyPlaylists.length && !searchLoading) {
          loadReadyPlaylists("populer");
        } else {
          renderList();
        }
      });
    });

    if (plCats) {
      plCats.addEventListener("click", function(e) {
        var cat = e.target.closest(".cat");
        if (!cat) return;
        plCats.querySelectorAll(".cat").forEach(function(c) { c.classList.remove("active"); });
        cat.classList.add("active");
        loadReadyPlaylists(cat.dataset.cat);
      });
    }

    function runPlSearch() {
      var q = plSearch.value.trim();
      if (!q) return;
      // Youtube Playlist sekmesi → playlist ara
      // Şarkı ara sekmesi → tekli video ara
      if (activeTab === "search") {
        doSongSearch(q);
      } else {
        // ready veya playlistim: playlist araması (ready sekmesine geçer)
        doSmartSearch(q);
      }
    }

    plSearchBtn.addEventListener("click", function() {
      runPlSearch();
    });
    plSearch.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        runPlSearch();
      }
    });
  </script>
</body>
