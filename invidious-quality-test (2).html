<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Kalite Buton Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #eee;
      min-height: 100vh;
      padding: 16px 14px 40px;
      line-height: 1.45;
    }
    .wrap { max-width: 800px; margin: 0 auto; }

    h1 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 0.78rem; color: #888; margin-bottom: 14px; }

    .player-wrap {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      border: 1px solid #222;
      margin-bottom: 12px;
      position: relative;
    }
    #playerHost {
      width: 100%;
      height: 100%;
      background: #000;
    }
    .loading {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 5;
    }
    .loading.show { display: flex; }

    /* Kalite butonları */
    .quality-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .q-btn {
      padding: 8px 12px;
      background: #2a2a2a;
      color: #ddd;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .q-btn:hover { background: #333; color: #fff; }
    .q-btn.active {
      background: #ff2d55;
      border-color: #ff2d55;
      color: #000;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }
    .btn {
      appearance: none;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }
    .btn:hover { background: #1d4ed8; }
    .btn.sec { background: #2a2a2a; color: #ddd; }
    .btn.sec:hover { background: #333; }

    .info {
      font-size: 0.78rem;
      color: #888;
      margin-left: auto;
    }
    .info strong { color: #4ade80; }

    .plist {
      list-style: none;
      margin: 0 0 14px 0;
      padding: 0;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
    }
    .plist li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #1f1f1f;
      font-size: 0.82rem;
    }
    .plist li:last-child { border-bottom: none; }
    .plist li:hover { background: #1c1c1c; }
    .plist li.active { background: rgba(255,45,85,0.12); }
    .plist .idx {
      width: 22px; height: 22px;
      border-radius: 6px;
      background: #222;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700; color: #999;
    }
    .plist li.active .idx { background: #ff2d55; color: #000; }
    .plist .title { font-weight: 600; }
    .plist .id { font-size: 0.7rem; color: #666; margin-left: auto; font-family: ui-monospace, monospace; }

    #log {
      background: #0f0f0f;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 10px;
      max-height: 260px;
      overflow: auto;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-line { margin-bottom: 2px; padding-bottom: 2px; border-bottom: 1px solid #1a1a1a; }
    .log-line .t { color: #555; margin-right: 6px; }
    .log-ok { color: #86efac; }
    .log-err { color: #f87171; }
    .log-info { color: #93c5fd; }
    .log-warn { color: #fbbf24; }

    .note {
      margin-top: 10px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      border-left: 3px solid #ff2d55;
      font-size: 0.72rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>YT IFrame Kalite Buton Test</h1>
    <p class="sub">small / medium / large / hd720 formatı · setPlaybackQuality</p>

    <div class="player-wrap">
      <div id="playerHost"></div>
      <div class="loading" id="loading">Yükleniyor…</div>
    </div>

    <!-- Kalite butonları -->
    <div class="quality-selector" id="qualitySelector">
      <button type="button" class="q-btn" data-q="default">Oto</button>
      <button type="button" class="q-btn" data-q="small">240p</button>
      <button type="button" class="q-btn" data-q="medium">360p</button>
      <button type="button" class="q-btn" data-q="large">480p</button>
      <button type="button" class="q-btn" data-q="hd720">720p</button>
      <button type="button" class="q-btn" data-q="hd1080">1080p</button>
      <button type="button" class="q-btn" data-q="highres">1440p+</button>
    </div>

    <div class="bar">
      <button type="button" class="btn sec" id="btnPrev">◀ Önceki</button>
      <button type="button" class="btn sec" id="btnNext">Sonraki ▶</button>
      <button type="button" class="btn" id="btnPlay">Oynat</button>
      <button type="button" class="btn sec" id="btnForce">Kaliteyi Uygula</button>
      <div class="info">
        Tercih: <strong id="prefLabel">—</strong>
        · Şu an: <strong id="curLabel">—</strong>
        · Durum: <strong id="stateLabel">—</strong>
      </div>
    </div>

    <ul class="plist" id="plist"></ul>

    <div class="note">
      <strong>Not:</strong> YouTube <code>setPlaybackQuality</code> komutunu her zaman hemen uygulamaz.
      Değişiklik bazen bir sonraki buffering’de veya kısa seek sonrası görünür.
    </div>

    <div id="log"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const PLAYLIST = [
      { id: "EQyuKThNXwk", title: "KÖK$VL & Sir Speedy - ZIPLA" },
      { id: "A7ShtPRP2Mc", title: "Test 2" },
      { id: "q2IMrkhSjSA", title: "Test 3" },
      { id: "69L-nKRY3ac", title: "Test 4" },
      { id: "HaJSYCFsgOY", title: "Test 5" }
    ];

    const PREF_KEY = "yt_q_pref_simple";
    let pref = "default";
    let index = 0;
    let player = null;
    let ytReady = false;
    let loadToken = 0;

    // Kayıtlı tercihi yükle
    try {
      const s = localStorage.getItem(PREF_KEY);
      if (s) pref = s;
    } catch (e) {}

    const loadingEl = document.getElementById("loading");
    const logEl = document.getElementById("log");
    const qualityButtons = document.querySelectorAll(".q-btn");

    function ts() {
      const d = new Date();
      return d.toLocaleTimeString("tr-TR") + "." + String(d.getMilliseconds()).padStart(3, "0");
    }
    function log(kind, msg, obj) {
      const line = document.createElement("div");
      line.className = "log-line log-" + (kind || "info");
      let text = typeof msg === "string" ? msg : JSON.stringify(msg);
      if (obj !== undefined) {
        try { text += " " + JSON.stringify(obj); } catch (e) {}
      }
      line.innerHTML = `<span class="t">${ts()}</span>${text.replace(/</g,"&lt;")}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
      console.log("[Q]", text, obj || "");
    }

    function prefText(q) {
      const map = {
        default: "Oto",
        small: "240p",
        medium: "360p",
        large: "480p",
        hd720: "720p",
        hd1080: "1080p",
        highres: "1440p+"
      };
      return map[q] || q;
    }

    function syncActiveButtons() {
      qualityButtons.forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-q") === pref);
      });
      document.getElementById("prefLabel").textContent = prefText(pref);
    }

    function renderPlaylist() {
      const ul = document.getElementById("plist");
      ul.innerHTML = "";
      PLAYLIST.forEach((item, i) => {
        const li = document.createElement("li");
        if (i === index) li.className = "active";
        li.innerHTML = `
          <span class="idx">${i + 1}</span>
          <span class="title">${item.title || item.id}</span>
          <span class="id">${item.id}</span>`;
        li.onclick = () => playIndex(i);
        ul.appendChild(li);
      });
    }

    function setLoading(on, text) {
      if (on) {
        loadingEl.textContent = text || "Yükleniyor…";
        loadingEl.classList.add("show");
      } else {
        loadingEl.classList.remove("show");
      }
    }

    // ——— Kalite uygula ———
    function applyQuality(reason) {
      if (!player || typeof player.setPlaybackQuality !== "function") {
        log("warn", "Player henüz hazır değil");
        return;
      }

      const quality = pref;
      log("info", "Kalite ayarlanıyor: " + quality + " (" + reason + ")");

      try {
        player.setPlaybackQuality(quality);
      } catch (e) {
        log("err", "setPlaybackQuality hata: " + (e && e.message));
      }

      // Range ile sabitlemeye çalış (bazı ortamlarda daha etkili)
      try {
        if (typeof player.setPlaybackQualityRange === "function") {
          if (quality === "default") {
            player.setPlaybackQualityRange("small", "highres");
          } else {
            player.setPlaybackQualityRange(quality, quality);
          }
        }
      } catch (e) {}

      // Gerçek durumu oku
      setTimeout(reportQuality, 700);
      setTimeout(reportQuality, 1800);
    }

    function reportQuality() {
      if (!player) return;
      try {
        const current = player.getPlaybackQuality ? player.getPlaybackQuality() : "?";
        const levels = player.getAvailableQualityLevels ? player.getAvailableQualityLevels() : [];
        document.getElementById("curLabel").textContent = current || "—";
        log("ok", "Rapor", { current, available: levels });
      } catch (e) {
        log("warn", "Kalite okunamadı");
      }
    }

    // ——— Player ———
    function createPlayer(videoId, token) {
      setLoading(true, "Player oluşturuluyor…");

      if (player) {
        try { player.destroy(); } catch (e) {}
        player = null;
      }
      document.getElementById("playerHost").innerHTML = "";

      player = new YT.Player("playerHost", {
        videoId: videoId,
        width: "100%",
        height: "100%",
        playerVars: {
          autoplay: 1,
          controls: 1,
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          fs: 1,
          enablejsapi: 1
        },
        events: {
          onReady: function (e) {
            if (token !== loadToken) return;
            log("ok", "Player ready · " + videoId);
            setLoading(false);
            try { e.target.playVideo(); } catch (err) {}
            applyQuality("onReady");
          },
          onStateChange: function (e) {
            if (token !== loadToken) return;
            const map = { "-1":"UNSTARTED","0":"ENDED","1":"PLAYING","2":"PAUSED","3":"BUFFERING","5":"CUED" };
            const name = map[String(e.data)] || e.data;
            document.getElementById("stateLabel").textContent = name;
            log("info", "State → " + name);

            if (e.data === YT.PlayerState.PLAYING) {
              setLoading(false);
              applyQuality("PLAYING");
            }
            if (e.data === YT.PlayerState.ENDED) {
              playIndex((index + 1) % PLAYLIST.length);
            }
          },
          onError: function (e) {
            log("err", "Player error: " + e.data);
            setLoading(false);
          },
          onPlaybackQualityChange: function (e) {
            log("ok", "Kalite değişti → " + e.data);
            document.getElementById("curLabel").textContent = e.data || "—";
          }
        }
      });
    }

    function loadVideo(videoId, token) {
      if (!player || typeof player.loadVideoById !== "function") {
        createPlayer(videoId, token);
        return;
      }
      setLoading(true, "Video yükleniyor…");
      try {
        player.loadVideoById({ videoId: videoId, startSeconds: 0 });
        log("info", "loadVideoById → " + videoId);
        setTimeout(() => {
          if (token !== loadToken) return;
          setLoading(false);
          applyQuality("loadVideoById");
        }, 500);
      } catch (e) {
        log("warn", "loadVideoById başarısız, recreate");
        createPlayer(videoId, token);
      }
    }

    function playIndex(i) {
      if (i < 0 || i >= PLAYLIST.length) return;
      index = i;
      renderPlaylist();
      loadToken++;
      const token = loadToken;
      const item = PLAYLIST[index];

      log("info", `—— ${index + 1}/${PLAYLIST.length} · ${item.id} · tercih=${prefText(pref)} ——`);
      document.getElementById("stateLabel").textContent = "…";
      document.getElementById("curLabel").textContent = "—";

      if (!ytReady) {
        setLoading(true, "YT API bekleniyor…");
        const t = setInterval(() => {
          if (ytReady) {
            clearInterval(t);
            loadVideo(item.id, token);
          }
        }, 200);
        return;
      }
      loadVideo(item.id, token);
    }

    // ——— Buton olayları ———
    qualityButtons.forEach(button => {
      button.addEventListener("click", () => {
        const quality = button.getAttribute("data-q");
        pref = quality;
        try { localStorage.setItem(PREF_KEY, pref); } catch (e) {}

        // Aktiflik görselini güncelle
        qualityButtons.forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
        document.getElementById("prefLabel").textContent = prefText(pref);

        log("info", "Buton tıklandı → " + quality);

        // YouTube IFrame API fonksiyonu
        if (player && typeof player.setPlaybackQuality === "function") {
          applyQuality("buton");
        } else {
          log("warn", "Player yok, kalite sonraki yüklemede uygulanacak");
        }
      });
    });

    document.getElementById("btnPrev").onclick = () => playIndex((index - 1 + PLAYLIST.length) % PLAYLIST.length);
    document.getElementById("btnNext").onclick = () => playIndex((index + 1) % PLAYLIST.length);
    document.getElementById("btnPlay").onclick = () => playIndex(index);
    document.getElementById("btnForce").onclick = () => applyQuality("manuel");

    // YT API
    window.onYouTubeIframeAPIReady = function () {
      ytReady = true;
      log("ok", "YouTube IFrame API hazır");
    };
    if (typeof YT !== "undefined" && YT.Player) {
      ytReady = true;
      log("ok", "YT API zaten yüklü");
    }

    // Başlangıç
    syncActiveButtons();
    renderPlaylist();
    log("info", "Hazır · tercih=" + prefText(pref));
  </script>
</body>
</html>
