<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>Minimal Müzik</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #home {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    #home::-webkit-scrollbar {
      width: 4px;
    }

    #home::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 2px;
    }

    .topbar {
      flex-shrink: 0;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #0a0a0a;
      border-bottom: 1px solid #1f1f1f;
    }

    .logo {
      flex-shrink: 0;
      width: 28px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 28px;
      height: 20px;
    }

    .voice-area {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      height: 42px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      padding: 0 12px;
      outline: none;
      -webkit-appearance: none;
    }

    #searchInput:focus {
      border-color: #3ea6ff;
    }

    #searchInput::placeholder {
      color: #666;
      font-size: 14px;
    }

    .mic-btn {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #3ea6ff;
      color: #000;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(62, 166, 255, 0.35);
    }

    .mic-btn:active {
      transform: scale(0.94);
      opacity: 0.9;
    }

    .mic-btn.listening {
      background: #ff2d55;
      color: #fff;
    }

    .cats {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      overflow-x: auto;
      scrollbar-width: none;
      background: #0a0a0a;
    }

    .cats::-webkit-scrollbar {
      display: none;
    }

    .cat {
      flex-shrink: 0;
      padding: 6px 12px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 20px;
      font-size: 12px;
      color: #ccc;
      cursor: pointer;
      white-space: nowrap;
    }

    .cat.active,
    .cat:active {
      background: #3ea6ff;
      color: #000;
      border-color: #3ea6ff;
    }

    .results {
      flex: 0 0 auto;
      overflow: visible;
      padding: 10px 10px 40px;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-content: flex-start;
      justify-content: flex-start;
    }

    .card {
      flex: 0 0 168px;
      width: 168px;
      height: 158px;
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      cursor: pointer;
      background: #161616;
      border: 1px solid #222;
      overflow: hidden;
      position: relative;
      box-sizing: border-box;
    }

    .card:active {
      background: #1e1e1e;
      border-color: #333;
    }

    .card img {
      width: 168px;
      height: 94px;
      object-fit: cover;
      background: #222;
      display: block;
      flex-shrink: 0;
    }

    .card-info {
      width: 168px;
      height: 64px;
      padding: 6px 8px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      color: #f0f0f0;
      height: 32px;
      max-height: 32px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .card-meta {
      font-size: 10px;
      color: #888;
      height: 14px;
      line-height: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .heart-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      border: none;
      font-size: 14px;
      cursor: pointer;
      color: #ddd;
      border-radius: 50%;
      z-index: 2;
    }

    .heart-btn:active {
      transform: scale(1.15);
    }

    .heart-btn.fav {
      color: #ff2d55;
      background: rgba(0,0,0,0.75);
    }

    .loading,
    .empty,
    .error,
    .load-more,
    .sentinel {
      flex: 0 0 100%;
      width: 100%;
      text-align: center;
      padding: 28px 16px;
      color: #666;
      font-size: 13px;
    }

    .error {
      color: #ff6b6b;
    }

    .load-more {
      padding: 16px;
      color: #777;
      font-size: 12px;
    }

    .sentinel {
      height: 1px;
      padding: 0;
      margin: 0;
      visibility: hidden;
    }

    #playerView {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      flex-direction: column;
    }

    #playerView.active {
      display: flex;
    }

    .player-top {
      flex-shrink: 0;
      height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      background: rgba(0,0,0,0.85);
    }

    .back-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    .player-title {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #eee;
    }

    .player-nav {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .player-nav button {
      background: #222;
      border: none;
      color: #fff;
      width: 36px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .player-nav button:active {
      background: #3ea6ff;
      color: #000;
    }

    .player-area {
      flex: 1;
      position: relative;
      background: #000;
      min-height: 0;
    }

    #ytplayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .player-loading {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.72);
      z-index: 5;
      align-items: center;
      justify-content: center;
      color: #ccc;
      font-size: 14px;
      pointer-events: none;
    }

    .player-loading.show {
      display: flex;
    }

    @media (max-width: 400px) {
      .results {
        gap: 8px;
        padding: 8px;
      }

      .card {
        flex: 0 0 148px;
        width: 148px;
        height: 148px;
      }

      .card img {
        width: 148px;
        height: 84px;
      }

      .card-info {
        width: 148px;
        height: 64px;
      }
    }

    @media (orientation: landscape) and (max-height: 480px) {
      .topbar {
        min-height: 44px;
        padding: 4px 10px;
      }

      .mic-btn {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }

      .cats {
        padding: 6px 8px;
      }

      .cat {
        padding: 5px 10px;
        font-size: 11px;
      }

      .player-top {
        height: 34px;
      }
    }

    /* Bağlantı kodu rozeti */


    .room-badge {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
    }
    .room-badge:active { border-color: #3ea6ff; }
    .room-badge .room-label {
      font-size: 10px;
      color: #888;
      line-height: 1;
    }
    .room-badge .room-code {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #3ea6ff;
      font-variant-numeric: tabular-nums;
    }
    .room-toast {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #eee;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 200;
      border: 1px solid #333;
    }
    .room-toast.show { display: block; }

    /* QR / bağlantı popup */
    .qr-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .qr-overlay.show {
      display: flex;
    }
    .qr-modal {
      background: #161616;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 20px 18px 16px;
      max-width: 300px;
      width: 100%;
      text-align: center;
    }
    .qr-modal h2 {
      font-size: 16px;
      font-weight: 600;
      color: #eee;
      margin-bottom: 4px;
    }
    .qr-modal .qr-hint {
      font-size: 12px;
      color: #888;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .qr-modal img {
      width: 200px;
      height: 200px;
      background: #fff;
      border-radius: 10px;
      display: block;
      margin: 0 auto 12px;
    }
    .qr-code-big {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #3ea6ff;
      margin-bottom: 8px;
    }
    .qr-url {
      font-size: 11px;
      color: #666;
      word-break: break-all;
      margin-bottom: 14px;
      line-height: 1.3;
    }
    .qr-actions {
      display: flex;
      gap: 8px;
    }
    .qr-actions button {
      flex: 1;
      height: 42px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .qr-copy {
      background: #3ea6ff;
      color: #000;
    }
    .qr-close {
      background: #2a2a2a;
      color: #ccc;
    }
  </style>
</head>

<body>
  <div id="home">

    <div class="topbar" style="flex-wrap: wrap;">
      <div class="logo" title="YouTube">
        <svg viewBox="0 0 28 20" xmlns="http://www.w3.org/2000/svg">
          <rect width="28" height="20" rx="4" ry="4" fill="#FF0000"/>
          <path d="M11.5 5.5v9l7.5-4.5-7.5-4.5z" fill="#FFFFFF"/>
        </svg>
      </div>

      <div class="voice-area">
        <input
          type="search"
          id="searchInput"
          placeholder="Mikrofona bas → klavyede 🎤 ile söyle"
          autocomplete="off"
          enterkeyhint="search"
          inputmode="search"
          lang="tr"
        />

        <button
          class="mic-btn"
          id="micBtn"
          type="button"
          title="Sesle ara"
        >🎤</button>
      </div>
      <div class="room-badge" id="roomBadge" title="Playlist bağlantı kodu — dokun, kopyala">
        <div>
          <div class="room-label">Playlist</div>
          <div class="room-code" id="roomCodeEl">······</div>
        </div>
      </div>
    </div>

    <div class="room-toast" id="roomToast">Kod kopyalandı</div>

    <div class="qr-overlay" id="qrOverlay">
      <div class="qr-modal">
        <h2>Playlist bağlantısı</h2>
        <div class="qr-hint">QR kodu okut — diğer cihaz playlist’e bağlanır</div>
        <img id="qrImage" alt="QR kod" width="200" height="200" />
        <div class="qr-code-big" id="qrCodeBig">······</div>
        <button type="button" id="regenCodeBtn" style="margin-top:10px;padding:8px 14px;background:#1c1c1c;border:1px solid #333;border-radius:10px;color:#aaa;font-size:12px;cursor:pointer;">Kodu yenile</button>
        <div class="qr-url" id="qrUrlText"></div>
        <div class="qr-actions">
          <button type="button" class="qr-copy" id="qrCopyBtn">Linki kopyala</button>
          <button type="button" class="qr-close" id="qrCloseBtn">Kapat</button>
        </div>
      </div>
    </div>

    <div class="cats" id="cats">
      <div class="cat" data-cat="favorites">♥ Favoriler</div>
      <div class="cat active" data-cat="turkce-pop">Türkçe Pop</div>
      <div class="cat" data-cat="turkce-rock">Türkçe Rock</div>
      <div class="cat" data-cat="arabesk">Arabesk</div>
      <div class="cat" data-cat="rap">Rap</div>
      <div class="cat" data-cat="slow">Slow</div>
      <div class="cat" data-cat="yabanci-pop">Yabancı Pop</div>
      <div class="cat" data-cat="klasik">Klasik</div>
      <div class="cat" data-cat="lofi">Lofi</div>
      <div class="cat" data-cat="populer">Popüler</div>
    </div>

    <div class="results" id="results">
      <div class="loading">Yükleniyor...</div>
    </div>
  </div>

  <div id="playerView">
    <div class="player-top">
      <button class="back-btn" id="backBtn">←</button>
      <div class="player-title" id="playerTitle"></div>

      <div class="player-nav">
        <button type="button" id="prevBtn" title="Önceki">⏮</button>
        <button type="button" id="nextBtn" title="Sonraki">⏭</button>
      </div>
    </div>

    <div class="player-area">
      <div class="player-loading" id="playerLoading">
        Sonraki şarkı yükleniyor...
      </div>

      <div id="playerPoster" style="position:absolute;inset:0;background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;">
        <div style="font-size:64px;opacity:0.35;">🎵</div>
      </div>

      <audio id="audioPlayer" playsinline preload="auto" style="display:none;"></audio>

      <iframe
        id="ytplayer"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
        allowfullscreen
        playsinline
        webkit-playsinline
        referrerpolicy="strict-origin-when-cross-origin"
        style="display:none;"
      ></iframe>


    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const SEARCH_INSTANCES = ["https://invidious.f5.si", "https://yt.chocolatemoo53.com", "https://invidious.nerdvpn.de", "https://invidious.tiekoetter.com"];
    const FAV_KEY = "minimal_yt_favorites";
    const ROOM_PREFIX = "mm-";
    const STORAGE_KEY = "minimal_muzik_sync";
    const BC_NAME = "minimal_muzik_bc";

    // Her kategori için birden fazla sorgu varyasyonu — her seferinde farklı set
    const CATEGORY_VARIANTS = {
      "turkce-pop": [
        "türkçe pop müzik",
        "türkçe pop 2024",
        "türkçe pop 2025",

        "netd müzik pop",

        "90lar türkçe pop"
      ],
      "turkce-rock": [
        "türkçe rock",
        "türk rock müzik",
        "anadolu rock",
        "türkçe rock en iyiler",
        "türkçe alternatif rock",
        "duman mor ve ötesi",
        "türk rock grupları",
        "türkçe hard rock"
      ],
      "arabesk": [
        "arabesk müzik",
        "arabesk şarkılar",
        "en iyi arabesk",
        "müslüm gürses",
        "orhan gencebay",
        "ferdi tayfur",
        "ibrahim tatlıses",
        "arabesk klasik"
      ],
      "rap": [
        "rap türkçe",
        "türkçe rap",
        "türkçe hip hop",
        "en iyi türkçe rap",
        "türkçe trap",
        "ceza sagopa",
        "yeni türkçe rap",
        "türkçe rap 2024"
      ],
      "slow": [
        "slow müzik",
        "slow şarkılar türkçe",
        "romantik şarkılar",
        "acı şarkılar",
        "slow türkçe",
        "duygusal şarkılar",
        "aşk şarkıları türkçe"
      ],
      "yabanci-pop": [
        "pop hits 2024",
        "english pop songs",
        "top pop hits",
        "billboard hot 100",
        "pop music 2025",
        "international pop",
        "viral pop songs"
      ],
      "klasik": [
        "klasik müzik",
        "classical music",
        "beethoven mozart",
        "orkestra klasik",
        "piano klasik",
        "klasik müzik en iyiler"
      ],
      "lofi": [
        "lofi hip hop",
        "lofi beats",
        "chill lofi",
        "lofi study music",
        "lofi jazz hop",
        "relaxing lofi"
      ],
      "populer": [
        "en çok dinlenen şarkılar",
        "türkiye trend müzik",
        "youtube müzik trend",
        "popüler türkçe şarkılar",
        "viral türkçe şarkılar",
        "en popüler müzik"
      ]
    };

    // Eski tek liste (load more rotasyonu için)
    const ALL_QUERIES = Object.values(CATEGORY_VARIANTS).flat();

    let currentMode = "search";
    let currentCatKey = "turkce-pop";
    let currentQuery = "türkçe pop müzik";
    let currentPage = 1;
    let isLoadingMore = false;
    let hasMore = true;
    let seenIds = new Set();
    let categoryRotateIndex = 0;
    let useCategoryRotate = true;
    let observer = null;
    let loadGen = 0;
    let batchSize = 24;
    let awaitingSwipe = false;
    let lastScrollTop = 0;

    // Kalıcı çalma kuyruğu + şu an çalan
    let playQueue = [];
    let playIndex = -1;
    let currentPlayingId = "";
    let currentPlayingTitle = "";
    let currentPlayingAuthor = "";
    let queueLocked = false;

    // —— Playlist bağlantı sistemi ——
    let roomCode = "";
    let syncBc = null;
    let peerHost = null;
    let peerConns = [];

    var ROOM_CODE_KEY = "minimal_muzik_room_code";

    function generateRoomCode() {
      var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      var code = "";
      for (var i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    // Bu cihaza özel kalıcı kod — her açılışta aynı kalır
    function getOrCreateRoomCode() {
      try {
        var saved = (localStorage.getItem(ROOM_CODE_KEY) || "").trim().toUpperCase();
        if (/^[A-Z0-9]{4,8}$/.test(saved)) {
          return saved;
        }
      } catch (e) {}
      var code = generateRoomCode();
      try {
        localStorage.setItem(ROOM_CODE_KEY, code);
      } catch (e) {}
      return code;
    }

    function regenerateRoomCode() {
      var code = generateRoomCode();
      try {
        localStorage.setItem(ROOM_CODE_KEY, code);
      } catch (e) {}
      return code;
    }

    function buildSyncState() {
      return {
        room: roomCode,
        now: currentPlayingId
          ? {
              id: currentPlayingId,
              title: currentPlayingTitle || "",
              author: currentPlayingAuthor || ""
            }
          : null,
        queue: playQueue.map(function(x) {
          return { id: x.id, title: x.title || "", author: x.author || "" };
        }),
        index: playIndex,
        updated: Date.now()
      };
    }

    function broadcastState() {
      if (!roomCode) return;
      var state = buildSyncState();
      try {
        localStorage.setItem(STORAGE_KEY + "_" + roomCode, JSON.stringify(state));
      } catch (e) {}
      try {
        if (syncBc) {
          syncBc.postMessage({ kind: "state", room: roomCode, state: state });
        }
      } catch (e) {}
      peerConns.forEach(function(c) {
        try {
          if (c.open) c.send({ kind: "state", state: state });
        } catch (e) {}
      });
    }

    function handleRemoteCommand(cmd) {
      if (!cmd || !cmd.type) return;

      // playlist.html'den gelen tüm çalma isteklerinde tam ekran zorla
      if (cmd.type === "next" || cmd.type === "prev" || cmd.type === "play" ||
          cmd.type === "setQueue" || cmd.type === "fullscreen") {
        try { forceFullscreenFromPlaylist(); } catch (e) {}
      }

      if (cmd.type === "fullscreen") {
        try { forceFullscreenFromPlaylist(); } catch (e) {}
        return;
      }
      if (cmd.type === "next") {
        playNext();
        return;
      }
      if (cmd.type === "prev") {
        playPrev();
        return;
      }
      if (cmd.type === "setMode") {
        queueLocked = cmd.mode === "manual";
        if (!queueLocked) {
          // Shuffle'a dönünce DOM listesine geri dön
          syncQueueFromDOM();
        }
        broadcastState();
        return;
      }
      if (cmd.type === "setQueue" && Array.isArray(cmd.queue)) {
        queueLocked = true;
        playQueue = cmd.queue.map(function(x) {
          return {
            id: x.id,
            title: x.title || "",
            author: x.author || ""
          };
        });
        playIndex = -1;
        if (currentPlayingId) {
          for (var i = 0; i < playQueue.length; i++) {
            if (playQueue[i].id === currentPlayingId) {
              playIndex = i;
              break;
            }
          }
        }
        // Hiçbir şey çalmıyorsa ve liste doluysa ilk şarkıyı otomatik başlat
        if (!currentPlayingId && playQueue.length > 0) {
          playAtIndex(0);
        } else {
          broadcastState();
        }
        return;
      }
      if (cmd.type === "play" && cmd.id) {
        var found = null;
        for (var i = 0; i < playQueue.length; i++) {
          if (playQueue[i].id === cmd.id) {
            found = playQueue[i];
            playIndex = i;
            break;
          }
        }
        if (found) {
          // Seçilen şarkı hemen autoplay ile çalsın
          playVideo(found.id, found.title, found.author, true);
        } else {
          playQueue.push({
            id: cmd.id,
            title: cmd.title || "",
            author: cmd.author || ""
          });
          playIndex = playQueue.length - 1;
          playVideo(cmd.id, cmd.title || "", cmd.author || "", true);
        }
      }
    }

    function initRoomSync() {
      roomCode = getOrCreateRoomCode();
      var el = document.getElementById("roomCodeEl");
      if (el) el.textContent = roomCode;

      try {
        syncBc = new BroadcastChannel(BC_NAME);
        syncBc.onmessage = function(ev) {
          var d = ev.data;
          if (!d || d.room !== roomCode) return;
          if (d.kind === "cmd" && d.cmd) handleRemoteCommand(d.cmd);
        };
      } catch (e) {}

      window.addEventListener("storage", function(ev) {
        if (ev.key === STORAGE_KEY + "_cmd_" + roomCode && ev.newValue) {
          try {
            handleRemoteCommand(JSON.parse(ev.newValue));
          } catch (e) {}
        }
      });

      // PeerJS host — farklı cihazlar için
      if (typeof Peer !== "undefined") {
        try {
          var hostId = ROOM_PREFIX + roomCode.toLowerCase();
          peerHost = new Peer(hostId);
          peerHost.on("connection", function(c) {
            peerConns.push(c);
            c.on("open", function() {
              c.send({ kind: "state", state: buildSyncState() });
            });
            c.on("data", function(data) {
              if (data && data.kind === "cmd" && data.cmd) {
                handleRemoteCommand(data.cmd);
              }
              if (data && data.kind === "hello") {
                c.send({ kind: "state", state: buildSyncState() });
              }
            });
            c.on("close", function() {
              peerConns = peerConns.filter(function(x) { return x !== c; });
            });
          });
          peerHost.on("error", function() {});
        } catch (e) {}
      }

      var badge = document.getElementById("roomBadge");
      var regenBtn = document.getElementById("regenCodeBtn");
      if (regenBtn) {
        regenBtn.addEventListener("click", function(e) {
          e.preventDefault();

          if (!confirm("Yeni bağlantı kodu oluşturulsun mu? Eski kod çalışan cihazlarda geçersiz olur.")) return;
          roomCode = regenerateRoomCode();
          var el = document.getElementById("roomCodeEl");
          if (el) el.textContent = roomCode;
          var big = document.getElementById("qrCodeBig");
          if (big) big.textContent = roomCode;
          // QR yenile
          try {
            var base = location.href.replace(/index\.html.*$/i, "").replace(/\/?$/, "/");
            if (location.pathname.indexOf("index.html") === -1) {
              base = location.origin + location.pathname.replace(/\/[^/]*$/, "/");
            }
            var plUrl = base + "playlist.html?c=" + roomCode;
            var qrImage = document.getElementById("qrImage");
            if (qrImage) {
              qrImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(plUrl);
            }
          } catch (err) {}
          if (toast) {
            toast.textContent = "Yeni kod: " + roomCode;
            toast.classList.add("show");
            setTimeout(function() { toast.classList.remove("show"); }, 2000);

      var toast = document.getElementById("roomToast");
      var qrOverlay = document.getElementById("qrOverlay");
      var qrImage = document.getElementById("qrImage");
      var qrCodeBig = document.getElementById("qrCodeBig");
      var qrUrlText = document.getElementById("qrUrlText");
      var qrCopyBtn = document.getElementById("qrCopyBtn");
      var qrCloseBtn = document.getElementById("qrCloseBtn");

      function getPlaylistUrl() {
        // index ile aynı klasörde playlist.html
        var base = location.href;
        // .../index.html veya .../ veya .../repo/
        if (/index\.html/i.test(base)) {
          base = base.replace(/index\.html.*/i, "");
        } else if (!base.endsWith("/")) {
          // dosya adı yoksa dizin kabul et
          var idx = base.lastIndexOf("/");
          if (idx > 8) base = base.slice(0, idx + 1);
        }
        return base + "playlist.html?c=" + roomCode;
      }

      function openQrPopup() {
        var url = getPlaylistUrl();
        if (qrCodeBig) qrCodeBig.textContent = roomCode;
        if (qrUrlText) qrUrlText.textContent = url;
        if (qrImage) {
          qrImage.src =

            encodeURIComponent(url);
        }
        if (qrOverlay) qrOverlay.classList.add("show");

        });

          }
          if (toast) {
            toast.textContent = "Playlist linki kopyalandı";
            toast.classList.add("show");
            setTimeout(function() { toast.classList.remove("show"); }, 2000);

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i];
        a[i] = a[j];
        a[j] = t;
      }
      return a;
    }

    function pickRandomQuery(catKey) {
      var list = CATEGORY_VARIANTS[catKey] || ["türkçe pop müzik"];
      return list[Math.floor(Math.random() * list.length)];
    }

    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveFavorites(list) {
      localStorage.setItem(FAV_KEY, JSON.stringify(list));
    }

    function isFavorite(id) {
      return getFavorites().some(function(v) {
        return v.videoId === id;
      });
    }

    function toggleFavorite(video) {
      var list = getFavorites();
      var idx = list.findIndex(function(v) {
        return v.videoId === video.videoId;
      });
      if (idx >= 0) {
        list.splice(idx, 1);
      } else {
        list.unshift({
          videoId: video.videoId,
          title: video.title || "",
          author: video.author || "",
          lengthSeconds: video.lengthSeconds || 0
        });
      }
      saveFavorites(list);
      return idx < 0;
    }

    function createCardHtml(v) {
      var thumbUrl = "https://i.ytimg.com/vi/" + v.videoId + "/hqdefault.jpg";
      var duration = formatDuration(v.lengthSeconds);
      var views = v.viewCount ? formatViews(v.viewCount) : "";
      var fav = isFavorite(v.videoId);
      var heart = fav ? "♥" : "♡";
      var heartClass = fav ? "heart-btn fav" : "heart-btn";
      var meta = [];
      if (v.author) meta.push(escapeHtml(v.author));
      if (duration) meta.push(duration);
      if (views) meta.push(views);

      return (
        '<div class="card" data-id="' + v.videoId +
        '" data-title="' + escapeHtml(v.title) +
        '" data-author="' + escapeHtml(v.author || "") +
        '" data-len="' + (v.lengthSeconds || 0) + '">' +
        '<img src="' + thumbUrl + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/' +
        v.videoId + '/mqdefault.jpg\'" />' +
        '<button class="' + heartClass + '" data-action="fav" title="' +
        (fav ? "Favoriden çıkar" : "Favoriye ekle") + '">' + heart + '</button>' +
        '<div class="card-info">' +
        '<div class="card-title">' + escapeHtml(v.title) + '</div>' +
        '<div class="card-meta">' + meta.join(" · ") + '</div>' +

    function attachCardListeners() {
      resultsEl.querySelectorAll(".card").forEach(function(card) {
        if (card.dataset.bound) return;
        card.dataset.bound = "1";

        card.addEventListener("click", function(e) {
          if (e.target.closest("[data-action=fav]")) {
            e.stopPropagation();

              videoId: card.dataset.id,
              title: card.dataset.title,
              author: card.dataset.author,
              lengthSeconds: parseInt(card.dataset.len, 10) || 0
            };

            var btn = card.querySelector("[data-action=fav]");
            if (added) {
              btn.textContent = "♥";
              btn.classList.add("fav");
              btn.title = "Favoriden çıkar";
            } else {

              btn.classList.remove("fav");

                syncQueueFromDOM();
                if (!resultsEl.querySelector(".card")) {
                  resultsEl.innerHTML =
                    '<div class="empty">Henüz favori yok.<br>Şarkılara ♥ basarak ekleyebilirsin.</div>';

    function ensureSentinel() {
      var old = resultsEl.querySelector(".sentinel");
      if (old) old.remove();
      var tip = resultsEl.querySelector(".load-more");
      if (tip) tip.remove();
      if (!hasMore || currentMode === "favorites") return;

      var sentinel = document.createElement("div");
      sentinel.className = "sentinel";
      sentinel.id = "scrollSentinel";
      resultsEl.appendChild(sentinel);

      if (observer) observer.disconnect();
      observer = new IntersectionObserver(
        function(entries) {
          if (
            entries[0].isIntersecting &&
            hasMore &&
            !isLoadingMore &&
            !awaitingSwipe &&
            currentMode !== "favorites"
          ) {
            loadMore();
          }
        },
        {
          root: document.getElementById("home"),
          rootMargin: "80px",
          threshold: 0
        }
      );
      observer.observe(sentinel);
    }

    function disconnectObserver() {
      if (observer) {
        observer.disconnect();
        observer = null;
      }
    }

    function syncQueueFromDOM() {
      // Manuel playlist kilitliyken ana ekran listesi kuyruğu ezmesin
      if (queueLocked) {
        broadcastState();
        return;
      }
      playQueue = [];
      resultsEl.querySelectorAll(".card").forEach(function(card) {
        playQueue.push({
          id: card.dataset.id,
          title: card.dataset.title || "",
          author: card.dataset.author || ""
        });
      });
      // Mevcut şarkının index'ini koru
      if (currentPlayingId) {
        playIndex = -1;
        for (var i = 0; i < playQueue.length; i++) {
          if (playQueue[i].id === currentPlayingId) {
            playIndex = i;
            break;
          }
        }
      }
      broadcastState();
    }

    function renderCards(videos, isFavList, append) {
      if (!append) {
        disconnectObserver();
        if (!videos.length) {
          resultsEl.innerHTML = isFavList
            ? '<div class="empty">Henüz favori yok.<br>Şarkılara ♥ basarak ekleyebilirsin.</div>'
            : '<div class="empty">Sonuç bulunamadı</div>';
          playQueue = [];
          return;
        }
        // Her seferinde karıştır → aynı liste gibi görünmesin
        videos = shuffle(videos);
        resultsEl.innerHTML = videos.map(createCardHtml).join("");
      } else {
        if (!videos.length) {
          ensureSentinel();
          return;
        }
        resultsEl.querySelectorAll(".sentinel, .load-more, .loading").forEach(function(el) {
          el.remove();
        });
        // Append edilenleri de hafif karıştır
        videos = shuffle(videos);
        resultsEl.insertAdjacentHTML("beforeend", videos.map(createCardHtml).join(""));
      }

      resultsEl.querySelectorAll(".loading").forEach(function(el) {
        el.remove();
      });
      attachCardListeners();
      syncQueueFromDOM();

      if (currentMode !== "favorites") {
        ensureSentinel();
      }
    }

    function showFavorites() {
      hasMore = false;
      isLoadingMore = false;
      disconnectObserver();
      seenIds.clear();
      var list = getFavorites();
      list.forEach(function(v) { seenIds.add(v.videoId); });
      if (!list.length) {
        resultsEl.innerHTML =
          '<div class="empty">Henüz favori yok.<br>Şarkılara ♥ basarak ekleyebilirsin.</div>';
        playQueue = [];
        return;
      }
      resultsEl.innerHTML = list.map(createCardHtml).join("");
      attachCardListeners();
      syncQueueFromDOM();
    }

    async function fetchSearch(query, page, preferViews) {
      for (var i = 0; i < SEARCH_INSTANCES.length; i++) {
        var inst = SEARCH_INSTANCES[i];
        try {
          var url =
            inst +
            "/api/v1/search?q=" +
            encodeURIComponent(query) +
            "&type=video&page=" +
            page +
            "&region=TR";

          // Popüler / çok dinlenen için views sıralama
          if (preferViews) {
            url += "&sort=views";
          }

          var res = await fetch(url, {
            signal: AbortSignal.timeout(10000)
          });
          if (!res.ok) continue;
          var data = await res.json();
          if (!Array.isArray(data)) continue;
          return data.filter(function(item) {
            return item.type === "video" && item.videoId;
          });
        } catch (e) {
          console.warn("Search failed:", inst, e);
        }
      }
      return null;
    }

    async function doSearch(query, reset, preferViews) {
      if (preferViews === undefined) preferViews = true;

      if (reset) {
        loadGen++;
        // Her açılışta rastgele sayfa ile başla (1–4) → farklı sonuçlar
        currentPage = 1 + Math.floor(Math.random() * 4);
        seenIds.clear();
        hasMore = true;
        isLoadingMore = false;
        awaitingSwipe = false;
        currentMode = "search";
        disconnectObserver();
        resultsEl.innerHTML = '<div class="loading">Aranıyor...</div>';
        document.getElementById("home").scrollTop = 0;
      }

      var gen = loadGen;
      isLoadingMore = true;

      if (reset) {
        var initialCollected = [];
        var initialPages = 0;
        var initialTarget = 20;
        var maxInitialPages = 5;
        var lastPageHadEnough = false;
        var initialFailed = false;
        var startPage = currentPage;

        while (
          initialCollected.length < initialTarget &&
          initialPages < maxInitialPages
        ) {
          initialPages++;
          var pageToFetch = startPage + initialPages - 1;
          currentPage = pageToFetch;

          // Kategori ise ara sıra farklı varyasyon dene
          var q = query;
          if (useCategoryRotate && currentCatKey && initialPages > 1 && Math.random() < 0.45) {
            q = pickRandomQuery(currentCatKey);
          }

          var pageVideos = await fetchSearch(q, pageToFetch, preferViews);

          if (gen !== loadGen || currentMode === "favorites") {
            isLoadingMore = false;
            return;
          }

          if (pageVideos === null) {
            initialFailed = true;
            break;
          }

          lastPageHadEnough = pageVideos.length >= 6;

          for (var i = 0; i < pageVideos.length; i++) {
            var v = pageVideos[i];
            if (seenIds.has(v.videoId)) continue;
            // Çok kısa videoları (shorts / intro) ele
            if (v.lengthSeconds && v.lengthSeconds < 60) continue;
            seenIds.add(v.videoId);
            initialCollected.push(v);
            if (initialCollected.length >= batchSize) break;
          }

          if (!pageVideos.length) break;
        }

        isLoadingMore = false;

        if (initialFailed && !initialCollected.length) {
          resultsEl.innerHTML =
            '<div class="error">Bağlantı hatası. Sayfayı yenile veya biraz sonra dene.</div>';
          hasMore = false;
          return;
        }

        if (!initialCollected.length) {
          resultsEl.innerHTML = '<div class="empty">Sonuç bulunamadı</div>';
          hasMore = false;
          return;
        }

        if (initialCollected.length > batchSize) {
          initialCollected = initialCollected.slice(0, batchSize);
        }

        hasMore = lastPageHadEnough || initialCollected.length >= 12;
        renderCards(initialCollected, false, false);
        awaitingSwipe = false;
        return;
      }

      // append path (load more)
      var videos = await fetchSearch(query, currentPage, preferViews);

      if (gen !== loadGen || currentMode === "favorites") {
        isLoadingMore = false;
        return;
      }

      isLoadingMore = false;

      if (videos === null) {
        hasMore = false;
        return;
      }

      var unique = videos.filter(function(v) {
        if (seenIds.has(v.videoId)) return false;
        if (v.lengthSeconds && v.lengthSeconds < 60) return false;
        seenIds.add(v.videoId);
        return true;
      });

      if (unique.length > batchSize) {
        unique = unique.slice(0, batchSize);
      }

      hasMore = videos.length >= 6;
      renderCards(unique, false, true);
      awaitingSwipe = false;
    }

    async function loadMore() {
      if (isLoadingMore || !hasMore || currentMode === "favorites") return;
      if (awaitingSwipe) return;

      isLoadingMore = true;
      awaitingSwipe = true;
      var gen = loadGen;

      var existing = resultsEl.querySelector(".load-more");
      if (!existing) {
        var tip = document.createElement("div");
        tip.className = "load-more";
        tip.textContent = "Daha fazla yükleniyor...";
        var sen = resultsEl.querySelector(".sentinel");
        if (sen) resultsEl.insertBefore(tip, sen);
        else resultsEl.appendChild(tip);
      }

      var collected = [];
      var attempts = 0;
      var maxAttempts = 5;

      while (collected.length < batchSize && attempts < maxAttempts) {
        attempts++;
        var videos = null;

        if (useCategoryRotate && currentCatKey) {
          // Aynı kategorinin farklı varyasyonlarından + rastgele sayfa
          var nextQ = pickRandomQuery(currentCatKey);
          var pageForCat = 1 + Math.floor(Math.random() * 6) + Math.floor(seenIds.size / 15);
          videos = await fetchSearch(nextQ, pageForCat, true);
        } else {
          currentPage += 1;
          videos = await fetchSearch(currentQuery, currentPage, false);
        }

        if (gen !== loadGen || currentMode === "favorites") {
          isLoadingMore = false;
          resultsEl.querySelectorAll(".load-more").forEach(function(el) { el.remove(); });
          return;
        }

        if (videos === null) {
          hasMore = false;
          break;
        }

        if (videos.length < 4) {
          hasMore = false;
        }

        for (var i = 0; i < videos.length && collected.length < batchSize; i++) {
          var v = videos[i];
          if (seenIds.has(v.videoId)) continue;
          if (v.lengthSeconds && v.lengthSeconds < 60) continue;
          seenIds.add(v.videoId);
          collected.push(v);
        }

        if (!hasMore) break;
      }

      resultsEl.querySelectorAll(".load-more").forEach(function(el) { el.remove(); });

      if (collected.length > 0) {
        renderCards(collected, false, true);
        hasMore = true;
      } else {
        hasMore = false;
      }

      isLoadingMore = false;
    }

    var homeEl = document.getElementById("home");
    homeEl.addEventListener(
      "scroll",
      function() {
        if (currentMode === "favorites" || isLoadingMore || !hasMore) return;
        var st = homeEl.scrollTop;
        var dist = homeEl.scrollHeight - st - homeEl.clientHeight;
        if (st < lastScrollTop - 30) {
          awaitingSwipe = false;
        }
        lastScrollTop = st;
        if (dist < 120 && !awaitingSwipe) {
          loadMore();
        }
      },
      { passive: true }
    );

    var playerView = document.getElementById("playerView");
    var ytplayer = document.getElementById("ytplayer");
    var playerTitle = document.getElementById("playerTitle");
    var backBtn = document.getElementById("backBtn");
    var prevBtn = document.getElementById("prevBtn");

    var playerLoading = document.getElementById("playerLoading");

    function setPlayerLoading(on, label) {
      if (!playerLoading) return;
      if (label) playerLoading.textContent = label;
      if (on) playerLoading.classList.add("show");
      else playerLoading.classList.remove("show");
    }

    var mediaUnlocked = true;
    var pendingPlayId = null;
    var audioPlayer = document.getElementById("audioPlayer");
    var playerPoster = document.getElementById("playerPoster");

    function unlockMedia() {
      mediaUnlocked = true;
      var tip = document.getElementById("tapToPlay");
      if (tip) tip.style.display = "none";
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          var ctx = new AC();
          if (ctx.state === "suspended") ctx.resume();
          var buf = ctx.createBuffer(1, 1, 22050);
          var src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start(0);
        }
      } catch (e) {}
      // Ses açılsın diye çalan şarkıyı bir kez sesli yenile
      if (pendingPlayId || currentPlayingId) {
        var id = pendingPlayId || currentPlayingId;
        pendingPlayId = null;
        loadIframeNow(id, false);
      }
    }

    ["pointerdown", "touchstart", "click"].forEach(function(ev) {
      document.addEventListener(ev, function() {
        if (!mediaUnlocked) unlockMedia();
      }, { capture: true, passive: true });
    });

    // —— YouTube IFrame API (bitiş → sonraki şarkı) ——
    var ytApiReady = false;
    var ytApiWaiters = [];
    var ytPlayerInstance = null;
    var ytHostId = "ytplayer-host";

    window.onYouTubeIframeAPIReady = function() {
      ytApiReady = true;
      ytApiWaiters.forEach(function(fn) {
        try { fn(); } catch (e) {}
      });
      ytApiWaiters = [];
    };
    // API bazen bizden önce yüklenir
    if (typeof YT !== "undefined" && YT.Player) {
      ytApiReady = true;
    }

    function whenYtReady(fn) {
      if (ytApiReady || (typeof YT !== "undefined" && YT.Player)) {
        ytApiReady = true;
        fn();
      } else {
        ytApiWaiters.push(fn);
        // iframe_api yoksa yedek: postMessage ile ENDED dinle
        setTimeout(function() {
          if (!ytApiReady) fn();
        }, 2500);
      }
    }

    function ensureYtHost() {
      var area = document.querySelector(".player-area");
      if (!area) return null;
      var tip = document.getElementById("tapToPlay");

      // Eski iframe / host temizle
      var oldFrame = document.getElementById("ytplayer");
      if (oldFrame) {
        try { oldFrame.remove(); } catch (e) {}
      }
      var host = document.getElementById(ytHostId);
      if (!host) {
        host = document.createElement("div");
        host.id = ytHostId;
        host.style.cssText =
          "position:absolute;inset:0;width:100%;height:100%;background:#000;z-index:1;";
        if (tip && tip.parentNode === area) {
          area.insertBefore(host, tip);
        } else {
          area.appendChild(host);
        }
      } else {
        // YT.Player destroy sonrası host boş olabilir — yeniden oluştur
        try {
          if (ytPlayerInstance && ytPlayerInstance.destroy) {
            ytPlayerInstance.destroy();
          }
        } catch (e) {}
        ytPlayerInstance = null;
        var parent = host.parentNode;
        var fresh = document.createElement("div");
        fresh.id = ytHostId;
        fresh.style.cssText = host.style.cssText;
        if (parent) {
          parent.replaceChild(fresh, host);
        }
        host = fresh;
      }
      return host;
    }

    function onYtStateChange(event) {
      // 0 = ENDED, 1 = PLAYING
      try {
        if (typeof YT !== "undefined") {
          if (event.data === YT.PlayerState.ENDED) {
            playNext();
            return;
          }
          if (event.data === YT.PlayerState.PLAYING) {
            goPlayerFullscreen();
          }
        }
      } catch (e) {}
      if (event && event.data === 0) {
        playNext();
      }
      if (event && event.data === 1) {
        goPlayerFullscreen();
      }
    }

    // YouTube videosunun kendi fullscreen modu (iframe üzerinde — playerView değil)
    function getYoutubeIframeEl() {
      try {
        if (ytPlayerInstance && typeof ytPlayerInstance.getIframe === "function") {
          var iframe = ytPlayerInstance.getIframe();
          if (iframe) return iframe;
        }
      } catch (e) {}
      var el = document.getElementById("ytplayer");
      if (el && el.tagName === "IFRAME") return el;
      // YT.Player host içindeki iframe
      var host = document.getElementById("ytplayer-host");
      if (host) {
        var inner = host.querySelector("iframe");
        if (inner) return inner;
      }
      return null;
    }

    function goPlayerFullscreen() {
      try {
        var el = getYoutubeIframeEl();
        if (!el) return false;
        var fsEl = document.fullscreenElement || document.webkitFullscreenElement ||
                   document.mozFullScreenElement || document.msFullscreenElement;
        // Zaten bu YouTube iframe fullscreen ise tamam
        if (fsEl === el) return true;
        var req =
          el.requestFullscreen ||
          el.webkitRequestFullscreen ||
          el.webkitRequestFullScreen ||
          el.mozRequestFullScreen ||
          el.msRequestFullscreen;
        if (req) {
          var p = req.call(el);
          if (p && typeof p.catch === "function") p.catch(function() {});
          return true;
        }
      } catch (e) {}
      return false;
    }

    // playlist / şarkı geçişlerinde player hazır olana kadar dene
    var _fsRemoteTimer = null;
    function forceFullscreenFromPlaylist() {
      try { goPlayerFullscreen(); } catch (e) {}
      if (_fsRemoteTimer) {
        try { clearInterval(_fsRemoteTimer); } catch (e) {}
        _fsRemoteTimer = null;
      }
      var attempts = 0;
      _fsRemoteTimer = setInterval(function() {
        attempts++;
        goPlayerFullscreen();
        var el = getYoutubeIframeEl();
        var fsEl = document.fullscreenElement || document.webkitFullscreenElement ||
                   document.mozFullScreenElement || document.msFullscreenElement;
        if ((el && fsEl === el) || attempts >= 16) {
          try { clearInterval(_fsRemoteTimer); } catch (e) {}
          _fsRemoteTimer = null;
        }
      }, 300);
    }

    function loadNocookieEmbed(id, muted) {
      try {
        if (audioPlayer) {
          audioPlayer.pause();
          audioPlayer.removeAttribute("src");
        }
      } catch (e) {}

      var area = document.querySelector(".player-area");
      if (playerPoster) playerPoster.style.display = "none";
      setPlayerLoading(true, "Yükleniyor...");

      // Mevcut YT.Player varsa SİLME — loadVideoById ile değiştir
      // (aynı iframe kalır → YouTube fullscreen düşmez)
      if (ytPlayerInstance && typeof ytPlayerInstance.loadVideoById === "function") {
        try {
          ytPlayerInstance.loadVideoById({
            videoId: id,
            startSeconds: 0
          });
          try { ytPlayerInstance.mute(); } catch (e) {}
          try { ytPlayerInstance.playVideo(); } catch (e) {}
          setPlayerLoading(false);
          if (!muted) {
            setTimeout(function() {
              try {
                ytPlayerInstance.unMute();
                ytPlayerInstance.setVolume(100);
                ytPlayerInstance.playVideo();
              } catch (e) {}
            }, 400);
          }
          setTimeout(goPlayerFullscreen, 200);
          setTimeout(goPlayerFullscreen, 600);
          setTimeout(goPlayerFullscreen, 1200);
          return;
        } catch (e) {
          // loadVideoById başarısız → yeniden oluştur
        }
      }

      // İlk kurulum veya yeniden oluşturma
      function clearPlayers() {
        var old = document.getElementById("ytplayer");
        try { if (old) old.remove(); } catch (e) {}
        var oldHost = document.getElementById(ytHostId);
        try { if (oldHost) oldHost.remove(); } catch (e) {}
        try {
          if (ytPlayerInstance && ytPlayerInstance.destroy) {
            ytPlayerInstance.destroy();
          }
        } catch (e) {}
        ytPlayerInstance = null;
      }
      clearPlayers();

      var host = ensureYtHost();
      if (!host) {
        loadRawIframe(id, muted);
        return;
      }

      whenYtReady(function() {
        try {
          if (typeof YT === "undefined" || !YT.Player) {
            loadRawIframe(id, muted);
            return;
          }
          clearPlayers();
          host = ensureYtHost();
          if (!host) {
            loadRawIframe(id, muted);
            return;
          }

          ytPlayerInstance = new YT.Player(host.id, {
            videoId: id,
            width: "100%",
            height: "100%",
            playerVars: {
              autoplay: 1,
              mute: 1,
              playsinline: 1,
              rel: 0,
              modestbranding: 1,
              controls: 1,
              fs: 1,
              iv_load_policy: 3,
              enablejsapi: 1,
              origin: (location.origin && location.protocol !== "file:") ? location.origin : undefined
            },
            events: {
              onReady: function(ev) {
                setPlayerLoading(false);
                try {
                  ev.target.mute();
                  ev.target.playVideo();
                  goPlayerFullscreen();
                  if (!muted) {
                    setTimeout(function() {
                      try {
                        ev.target.unMute();
                        ev.target.setVolume(100);
                        ev.target.playVideo();
                      } catch (e2) {}
                    }, 300);
                    setTimeout(function() {
                      try {
                        ev.target.unMute();
                        ev.target.playVideo();
                      } catch (e3) {}
                    }, 900);
                  }
                  setTimeout(goPlayerFullscreen, 200);
                  setTimeout(goPlayerFullscreen, 600);
                  setTimeout(goPlayerFullscreen, 1200);
                } catch (e) {}
              },
              onStateChange: onYtStateChange,
              onError: function(ev) {
                try { clearPlayers(); } catch (e) {}
                loadRawIframe(id, muted);
              }
            }
          });
          ytplayer = host;
        } catch (e) {
          loadRawIframe(id, muted);
        }
      });

      function loadRawIframe(vid, isMuted) {
        clearPlayers();
        var frame = document.createElement("iframe");
        frame.id = "ytplayer";
        frame.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen");
        frame.setAttribute("allowfullscreen", "true");
        frame.setAttribute("playsinline", "");
        frame.setAttribute("webkit-playsinline", "");
        frame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
        frame.style.cssText =
          "position:absolute;inset:0;width:100%;height:100%;border:none;background:#000;z-index:1;";
        var origin = (location.origin && location.origin !== "null" && location.protocol !== "file:")
          ? location.origin
          : "https://www.youtube.com";
        frame.src =
          "https://www.youtube.com/embed/" + vid +
          "?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1" +
          "&iv_load_policy=3&controls=1&fs=1&origin=" + encodeURIComponent(origin) +
          "&widget_referrer=" + encodeURIComponent(origin);
        if (area) area.appendChild(frame);
        ytplayer = frame;

        function sendPlay() {
          try {
            if (!frame.contentWindow) return;
            frame.contentWindow.postMessage(
              JSON.stringify({ event: "command", func: "playVideo", args: [] }), "*"
            );
            frame.contentWindow.postMessage(
              JSON.stringify({ event: "command", func: "unMute", args: [] }), "*"
            );
          } catch (e) {}
        }
        frame.addEventListener("load", function() {
          setPlayerLoading(false);
          sendPlay();
          goPlayerFullscreen();
          setTimeout(sendPlay, 400);
          setTimeout(goPlayerFullscreen, 400);
          setTimeout(sendPlay, 1000);
          setTimeout(goPlayerFullscreen, 1000);
          setTimeout(sendPlay, 2000);
          setTimeout(goPlayerFullscreen, 2000);
        });
        window.addEventListener("message", function handler(evt) {
          try {
            var d = typeof evt.data === "string" ? JSON.parse(evt.data) : evt.data;
            if (d && d.event === "onStateChange" && d.info === 0) {
              window.removeEventListener("message", handler);
              playNext();
            }
          } catch (e) {}
        });
      }
    }

    function forceLoadVideo(id) {
      setPlayerLoading(true, "Yükleniyor...");
      pendingPlayId = id;
      if (playerPoster) {
        playerPoster.style.backgroundImage =
          "url(https://i.ytimg.com/vi/" + id + "/hqdefault.jpg)";
      }
      loadNocookieEmbed(id, !mediaUnlocked);
    }

    function loadVideoInSamePlayer(id) {
      forceLoadVideo(id);
    }

    function loadIframeNow(id, muted) {
      loadNocookieEmbed(id, muted);
    }

    function playAtIndex(idx) {
      if (!playQueue.length) return;
      if (idx < 0) idx = playQueue.length - 1;
      if (idx >= playQueue.length) idx = 0;

      // Aynı şarkıysa bir sonrakine zorla geç
      if (playQueue[idx].id === currentPlayingId && playQueue.length > 1) {
        idx = (idx + 1) % playQueue.length;
      }

      playIndex = idx;
      var item = playQueue[idx];
      playVideo(item.id, item.title, item.author, true);
    }

    function playNext() {
      // Direksiyon / Media Session / playlist / UI — hepsi buradan geçer
      try { forceFullscreenFromPlaylist(); } catch (e) {}
      syncQueueFromDOM();
      if (!playQueue.length) return;

      // currentPlayingId ile index bul
      var found = -1;
      for (var j = 0; j < playQueue.length; j++) {
        if (playQueue[j].id === currentPlayingId) {
          found = j;
          break;
        }
      }
      if (found >= 0) playIndex = found;

      var next = playIndex + 1;
      if (next >= playQueue.length) next = 0;

      // Hâlâ aynıysa (tek şarkı hariç) rastgele farklı bir tane seç
      if (playQueue.length > 1 && playQueue[next].id === currentPlayingId) {
        var candidates = playQueue.filter(function(x) {
          return x.id !== currentPlayingId;
        });
        if (candidates.length) {
          var pick = candidates[Math.floor(Math.random() * candidates.length)];
          for (var k = 0; k < playQueue.length; k++) {
            if (playQueue[k].id === pick.id) {
              next = k;
              break;
            }
          }
        }
      }

      playAtIndex(next);
    }

    function playPrev() {
      // Direksiyon / Media Session / playlist / UI — hepsi buradan geçer
      try { forceFullscreenFromPlaylist(); } catch (e) {}
      syncQueueFromDOM();
      if (!playQueue.length) return;

      var found = -1;
      for (var j = 0; j < playQueue.length; j++) {
        if (playQueue[j].id === currentPlayingId) {
          found = j;
          break;
        }
      }
      if (found >= 0) playIndex = found;

      var prev = playIndex - 1;
      if (prev < 0) prev = playQueue.length - 1;

      if (playQueue.length > 1 && playQueue[prev].id === currentPlayingId) {
        var candidates = playQueue.filter(function(x) {
          return x.id !== currentPlayingId;
        });
        if (candidates.length) {
          var pick = candidates[Math.floor(Math.random() * candidates.length)];
          for (var k = 0; k < playQueue.length; k++) {
            if (playQueue[k].id === pick.id) {
              prev = k;
              break;
            }
          }
        }
      }

      playAtIndex(prev);
    }

    function updateMediaSession(title, author, videoId) {
      if (!("mediaSession" in navigator)) return;
      try {
        var art = videoId
          ? [
              {
                src: "https://i.ytimg.com/vi/" + videoId + "/hqdefault.jpg",
                sizes: "480x360",
                type: "image/jpeg"
              },
              {
                src: "https://i.ytimg.com/vi/" + videoId + "/mqdefault.jpg",
                sizes: "320x180",
                type: "image/jpeg"
              }
            ]
          : [];

        navigator.mediaSession.metadata = new MediaMetadata({
          title: title || "Minimal Müzik",
          artist: author || "YouTube",
          album: "Minimal Müzik",
          artwork: art
        });

        navigator.mediaSession.playbackState = "playing";

        // Handler'ları her seferinde yeniden bağla (araç kontrolleri için kritik)
        navigator.mediaSession.setActionHandler("play", function() {
          navigator.mediaSession.playbackState = "playing";
        });
        navigator.mediaSession.setActionHandler("pause", function() {
          navigator.mediaSession.playbackState = "paused";
        });
        navigator.mediaSession.setActionHandler("stop", function() {
          ytplayer.src = "";
          playerView.classList.remove("active");
          currentPlayingId = "";
          navigator.mediaSession.playbackState = "none";
        });
        navigator.mediaSession.setActionHandler("nexttrack", function() {
          try { forceFullscreenFromPlaylist(); } catch (e) {}
          playNext();
        });
        navigator.mediaSession.setActionHandler("previoustrack", function() {
          try { forceFullscreenFromPlaylist(); } catch (e) {}
          playPrev();
        });
      } catch (e) {
        console.warn("MediaSession error", e);
      }
    }

    function clearMediaSession() {
      if (!("mediaSession" in navigator)) return;
      try {
        navigator.mediaSession.playbackState = "none";
        navigator.mediaSession.metadata = null;
      } catch (e) {}
    }

    function playVideo(id, title, author, fromQueue) {
      if (!id) return;
      // Her şarkı geçişinde YouTube fullscreen (direksiyon / playlist / UI)
      try { forceFullscreenFromPlaylist(); } catch (e) {}

      // Kuyruğu güncelle
      if (!fromQueue) {
        syncQueueFromDOM();
        playIndex = -1;
        for (var i = 0; i < playQueue.length; i++) {
          if (playQueue[i].id === id) {
            playIndex = i;
            break;
          }
        }
        // Listede yoksa ekle
        if (playIndex < 0) {
          playQueue.push({ id: id, title: title || "", author: author || "" });
          playIndex = playQueue.length - 1;
        }
      }

      currentPlayingId = id;
      currentPlayingTitle = title || "";
      currentPlayingAuthor = author || "";
      playerTitle.textContent = title || "";
      updateMediaSession(title, author, id);
      broadcastState();

      var alreadyOpen = playerView.classList.contains("active");
      if (alreadyOpen) {
        setPlayerLoading(true, fromQueue ? "Sonraki şarkı yükleniyor..." : "Yükleniyor...");
        loadVideoInSamePlayer(id);
      } else {
        playerView.classList.add("active");
        setPlayerLoading(true, "Yükleniyor...");
        loadVideoInSamePlayer(id);
      }
    }

    backBtn.addEventListener("click", function() {
      try {
        if (audioPlayer) {
          audioPlayer.pause();
          audioPlayer.removeAttribute("src");
          audioPlayer.load();
        }
      } catch (e) {}
      try {
        if (ytplayer) {
          ytplayer.onload = null;
          ytplayer.src = "";
        }
      } catch (e) {}
      playerView.classList.remove("active");
      setPlayerLoading(false);
      currentPlayingId = "";
      currentPlayingTitle = "";
      currentPlayingAuthor = "";
      clearMediaSession();
      broadcastState();
    });

    prevBtn.addEventListener("click", function() {
      playPrev();
    });

    nextBtn.addEventListener("click", function() {
      playNext();
    });

    function formatDuration(sec) {
      if (!sec) return "";
      var m = Math.floor(sec / 60);
      var s = sec % 60;
      return m + ":" + s.toString().padStart(2, "0");
    }

    function formatViews(n) {
      if (!n) return "";
      if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(0) + "K";
      return String(n);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // İlk yükleme — rastgele sorgu + views sıralama + karıştırma
    useCategoryRotate = true;
    currentCatKey = "turkce-pop";
    currentQuery = pickRandomQuery("turkce-pop");



    initRoomSync();
    doSearch(currentQuery, true, true);
  </script>
