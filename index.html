<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>Minimal Müzik</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='24' font-size='24'>🎵</text></svg>">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #home {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    #home::-webkit-scrollbar {
      width: 4px;
    }

    #home::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 2px;
    }

    .topbar {
      flex-shrink: 0;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #0a0a0a;
      border-bottom: 1px solid #1f1f1f;
    }

    .logo {
      flex-shrink: 0;
      width: 28px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 28px;
      height: 20px;
    }

    .voice-area {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      height: 42px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      padding: 0 12px;
      outline: none;
      -webkit-appearance: none;
    }

    #searchInput:focus {
      border-color: #3ea6ff;
    }

    #searchInput::placeholder {
      color: #666;
      font-size: 14px;
    }

    .mic-btn {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #3ea6ff;
      color: #000;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(62, 166, 255, 0.35);
    }

    .mic-btn:active {
      transform: scale(0.94);
      opacity: 0.9;
    }

    .mic-btn.listening {
      background: #ff2d55;
      color: #fff;
    }

    .cats {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      overflow-x: auto;
      scrollbar-width: none;
      background: #0a0a0a;
    }

    .cats::-webkit-scrollbar {
      display: none;
    }

    .cat {
      flex-shrink: 0;
      padding: 6px 12px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 20px;
      font-size: 12px;
      color: #ccc;
      cursor: pointer;
      white-space: nowrap;
    }

    .cat.active,
    .cat:active {
      background: #3ea6ff;
      color: #000;
      border-color: #3ea6ff;
    }

    .results {
      flex: 0 0 auto;
      overflow: visible;
      padding: 10px 10px 40px;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-content: flex-start;
      justify-content: flex-start;
    }

    .card {
      flex: 0 0 168px;
      width: 168px;
      height: 158px;
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      cursor: pointer;
      background: #161616;
      border: 1px solid #222;
      overflow: hidden;
      position: relative;
      box-sizing: border-box;
    }

    .card:active {
      background: #1e1e1e;
      border-color: #333;
    }

    .card img {
      width: 168px;
      height: 94px;
      object-fit: cover;
      background: #222;
      display: block;
      flex-shrink: 0;
    }

    .card-info {
      width: 168px;
      height: 64px;
      padding: 6px 8px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      color: #f0f0f0;
      height: 32px;
      max-height: 32px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .card-meta {
      font-size: 10px;
      color: #888;
      height: 14px;
      line-height: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .heart-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      border: none;
      font-size: 14px;
      cursor: pointer;
      color: #ddd;
      border-radius: 50%;
      z-index: 2;
    }

    .heart-btn:active {
      transform: scale(1.15);
    }

    .heart-btn.fav {
      color: #ff2d55;
      background: rgba(0,0,0,0.75);
    }

    .loading,
    .empty,
    .error,
    .load-more,
    .sentinel {
      flex: 0 0 100%;
      width: 100%;
      text-align: center;
      padding: 28px 16px;
      color: #666;
      font-size: 13px;
    }

    .error {
      color: #ff6b6b;
    }

    .load-more {
      padding: 16px;
      color: #777;
      font-size: 12px;
    }

    .sentinel {
      height: 1px;
      padding: 0;
      margin: 0;
      visibility: hidden;
    }

    #playerView {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      flex-direction: column;
    }

    #playerView.active {
      display: flex;
    }

    .player-top {
      flex-shrink: 0;
      height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      background: rgba(0,0,0,0.85);
    }

    .back-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    .player-title {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #eee;
    }

    .player-nav {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .player-nav button {
      background: #222;
      border: none;
      color: #fff;
      width: 36px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .player-nav button:active {
      background: #3ea6ff;
      color: #000;
    }

    .player-area {
      flex: 1;
      position: relative;
      background: #000;
      min-height: 0;
    }

    #ytplayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .player-loading {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.72);
      z-index: 5;
      align-items: center;
      justify-content: center;
      color: #ccc;
      font-size: 14px;
      pointer-events: none;
    }

    .player-loading.show {
      display: flex;
    }

    @media (max-width: 400px) {
      .results {
        gap: 8px;
        padding: 8px;
      }

      .card {
        flex: 0 0 148px;
        width: 148px;
        height: 148px;
      }

      .card img {
        width: 148px;
        height: 84px;
      }

      .card-info {
        width: 148px;
        height: 64px;
      }
    }

    @media (orientation: landscape) and (max-height: 480px) {
      .topbar {
        min-height: 44px;
        padding: 4px 10px;
      }

      .mic-btn {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }

      .cats {
        padding: 6px 8px;
      }

      .cat {
        padding: 5px 10px;
        font-size: 11px;
      }

      .player-top {
        height: 34px;
      }
    }

    /* Bağlantı kodu rozeti */


    .room-badge {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
    }
    .room-badge:active { border-color: #3ea6ff; }
    .room-badge .room-label {
      font-size: 10px;
      color: #888;
      line-height: 1;
    }
    .room-badge .room-code {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #3ea6ff;
      font-variant-numeric: tabular-nums;
    }
    .room-toast {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #eee;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 200;
      border: 1px solid #333;
    }
    .room-toast.show { display: block; }

    /* QR / bağlantı popup */
    .qr-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .qr-overlay.show {
      display: flex;
    }
    .qr-modal {
      background: #161616;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 10px;
      width: min(220px, calc(100vw - 20px));
      max-height: min(85vh, 380px);
      overflow-y: auto;
      text-align: center;
      box-sizing: border-box;
    }
    .qr-modal h2 {
      font-size: 13px;
      font-weight: 600;
      color: #eee;
      margin: 0 0 2px;
    }
    .qr-modal .qr-hint {
      font-size: 10px;
      color: #888;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .qr-modal img {
      width: 120px;
      height: 120px;
      max-width: 100%;
      background: #fff;
      border-radius: 6px;
      display: block;
      margin: 0 auto 6px;
    }
    .qr-code-big {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #3ea6ff;
      margin-bottom: 4px;
    }
    .qr-url {
      font-size: 9px;
      color: #666;
      word-break: break-all;
      margin-bottom: 6px;
      line-height: 1.25;
      max-height: 2.5em;
      overflow: hidden;
    }
    .qr-actions {
      display: flex;
      gap: 6px;
    }
    .qr-actions button {
      flex: 1;
      height: 34px;
      border: none;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .qr-copy {
      background: #3ea6ff;
      color: #000;
    }
    .qr-close {
      background: #2a2a2a;
      color: #ccc;
    }
    #regenCodeBtn {
      margin-top: 6px !important;
      padding: 5px 8px !important;
      font-size: 10px !important;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div id="home">

    <div class="topbar" style="flex-wrap: wrap;">
      <div class="logo" title="YouTube">
        <svg viewBox="0 0 28 20" xmlns="http://www.w3.org/2000/svg">
          <rect width="28" height="20" rx="4" ry="4" fill="#FF0000"/>
          <path d="M11.5 5.5v9l7.5-4.5-7.5-4.5z" fill="#FFFFFF"/>
        </svg>
      </div>

      <div class="voice-area">
        <input
          type="search"
          id="searchInput"
          placeholder="Mikrofona bas → klavyede 🎤 ile söyle"
          autocomplete="off"
          enterkeyhint="search"
          inputmode="search"
          lang="tr"
        />

        <button
          class="mic-btn"
          id="micBtn"
          type="button"
          title="Sesle ara"
        >🎤</button>
      </div>
      <div class="room-badge" id="roomBadge" title="Playlist bağlantı kodu — dokun, kopyala">
        <div>
          <div class="room-label">Playlist</div>
          <div class="room-code" id="roomCodeEl">······</div>
        </div>
      </div>
    </div>

    <div class="room-toast" id="roomToast">Kod kopyalandı</div>

    <div class="qr-overlay" id="qrOverlay">
      <div class="qr-modal">
        <h2>Playlist bağlantısı</h2>
        <div class="qr-hint">QR kodu okut — diğer cihaz playlist’e bağlanır</div>
        <img id="qrImage" alt="QR kod" width="120" height="120" />
        <div class="qr-code-big" id="qrCodeBig">······</div>
        <button type="button" id="regenCodeBtn" style="margin-top:10px;padding:8px 14px;background:#1c1c1c;border:1px solid #333;border-radius:10px;color:#aaa;font-size:12px;cursor:pointer;">Kodu yenile</button>
        <div class="qr-url" id="qrUrlText"></div>
        <div class="qr-actions">
          <button type="button" class="qr-copy" id="qrCopyBtn">Linki kopyala</button>
          <button type="button" class="qr-close" id="qrCloseBtn">Kapat</button>
        </div>
      </div>
    </div>

    <div class="cats" id="cats">
      <div class="cat" data-cat="favorites">♥ Favoriler</div>
      <div class="cat active" data-cat="turkce-pop">Türkçe Pop</div>
      <div class="cat" data-cat="turkce-rock">Türkçe Rock</div>
      <div class="cat" data-cat="arabesk">Arabesk</div>
      <div class="cat" data-cat="rap">Rap</div>
      <div class="cat" data-cat="slow">Slow</div>
      <div class="cat" data-cat="yabanci-pop">Yabancı Pop</div>
      <div class="cat" data-cat="klasik">Klasik</div>
      <div class="cat" data-cat="lofi">Lofi</div>
      <div class="cat" data-cat="populer">Popüler</div>
    </div>

    <div class="results" id="results">
      <div class="loading">Yükleniyor...</div>
    </div>
  </div>

  <div id="playerView">
    <div class="player-top">
      <button class="back-btn" id="backBtn">←</button>
      <div class="player-title" id="playerTitle"></div>

      <div class="player-nav">
        <button type="button" id="prevBtn" title="Önceki">⏮</button>
        <button type="button" id="nextBtn" title="Sonraki">⏭</button>
      </div>
    </div>

    <div class="player-area">
      <div class="player-loading" id="playerLoading">
        Sonraki şarkı yükleniyor...
      </div>

      <div id="playerPoster" style="position:absolute;inset:0;background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;">
        <div style="font-size:64px;opacity:0.35;">🎵</div>
      </div>

      <audio id="audioPlayer" playsinline preload="auto" style="display:none;"></audio>

      <iframe
        id="ytplayer"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; web-share; fullscreen"
        playsinline
        webkit-playsinline
        referrerpolicy="strict-origin-when-cross-origin"
        style="position:absolute;inset:0;width:100%;height:100%;border:none;background:#000;z-index:1;display:none;"
      ></iframe>


    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const SEARCH_INSTANCES = ["https://invidious.f5.si", "https://yt.chocolatemoo53.com", "https://invidious.nerdvpn.de", "https://invidious.tiekoetter.com"];
    const FAV_KEY = "minimal_yt_favorites";
    const ROOM_PREFIX = "mm-";
    const STORAGE_KEY = "minimal_muzik_sync";
    const BC_NAME = "minimal_muzik_bc";

    // Her kategori için birden fazla sorgu varyasyonu — her seferinde farklı set
    const CATEGORY_VARIANTS = {
      "turkce-pop": [
        "türkçe pop müzik",
        "türkçe pop 2024",
        "türkçe pop 2025",
        "en popüler türkçe pop",
        "türkçe hit şarkılar",
        "türkçe popüler müzik",
        "netd müzik pop",
        "türkçe pop listesi",
        "yeni türkçe pop",
        "90lar türkçe pop"
      ],
      "turkce-rock": [
        "türkçe rock",
        "türk rock müzik",
        "anadolu rock",
        "türkçe rock en iyiler",
        "türkçe alternatif rock",
        "duman mor ve ötesi",
        "türk rock grupları",
        "türkçe hard rock"
      ],
      "arabesk": [
        "arabesk müzik",
        "arabesk şarkılar",
        "en iyi arabesk",
        "müslüm gürses",
        "orhan gencebay",
        "ferdi tayfur",
        "ibrahim tatlıses",
        "arabesk klasik"
      ],
      "rap": [
        "rap türkçe",
        "türkçe rap",
        "türkçe hip hop",
        "en iyi türkçe rap",
        "türkçe trap",
        "ceza sagopa",
        "yeni türkçe rap",
        "türkçe rap 2024"
      ],
      "slow": [
        "slow müzik",
        "slow şarkılar türkçe",
        "romantik şarkılar",
        "acı şarkılar",
        "slow türkçe",
        "duygusal şarkılar",
        "aşk şarkıları türkçe"
      ],
      "yabanci-pop": [
        "pop hits 2024",
        "english pop songs",
        "top pop hits",
        "billboard hot 100",
        "pop music 2025",
        "international pop",
        "viral pop songs"
      ],
      "klasik": [
        "klasik müzik",
        "classical music",
        "beethoven mozart",
        "orkestra klasik",
        "piano klasik",
        "klasik müzik en iyiler"
      ],
      "lofi": [
        "lofi hip hop",
        "lofi beats",
        "chill lofi",
        "lofi study music",
        "lofi jazz hop",
        "relaxing lofi"
      ],
      "populer": [
        "en çok dinlenen şarkılar",
        "türkiye trend müzik",
        "youtube müzik trend",
        "popüler türkçe şarkılar",
        "viral türkçe şarkılar",
        "en popüler müzik"
      ]
    };

    // Eski tek liste (load more rotasyonu için)
    const ALL_QUERIES = Object.values(CATEGORY_VARIANTS).flat();

    let currentMode = "search";
    let currentCatKey = "turkce-pop";
    let currentQuery = "türkçe pop müzik";
    let currentPage = 1;
    let isLoadingMore = false;
    let hasMore = true;
    let seenIds = new Set();
    let categoryRotateIndex = 0;
    let useCategoryRotate = true;
    let observer = null;
    let loadGen = 0;
    let batchSize = 24;
    let awaitingSwipe = false;
    let lastScrollTop = 0;

    // Kalıcı çalma kuyruğu + şu an çalan
    let playQueue = [];
    let playIndex = -1;
    let currentPlayingId = "";
    let currentPlayingTitle = "";
    let currentPlayingAuthor = "";
    let queueLocked = false;

    // —— Playlist bağlantı sistemi ——
    let roomCode = "";
    let syncBc = null;
    let peerHost = null;
    let peerConns = [];

    var ROOM_CODE_KEY = "minimal_muzik_room_code";

    function generateRoomCode() {
      var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      var code = "";
      for (var i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    // Bu cihaza özel kalıcı kod — her açılışta aynı kalır
    function getOrCreateRoomCode() {
      try {
        var saved = (localStorage.getItem(ROOM_CODE_KEY) || "").trim().toUpperCase();
        if (/^[A-Z0-9]{4,8}$/.test(saved)) {
          return saved;
        }
      } catch (e) {}
      var code = generateRoomCode();
      try {
        localStorage.setItem(ROOM_CODE_KEY, code);
      } catch (e) {}
      return code;
    }

    function regenerateRoomCode() {
      var code = generateRoomCode();
      try {
        localStorage.setItem(ROOM_CODE_KEY, code);
      } catch (e) {}
      return code;
    }

    function buildSyncState() {
      return {
        room: roomCode,
        now: currentPlayingId
          ? {
              id: currentPlayingId,
              title: currentPlayingTitle || "",
              author: currentPlayingAuthor || ""
            }
          : null,
        queue: playQueue.map(function(x) {
          return { id: x.id, title: x.title || "", author: x.author || "" };
        }),
        index: playIndex,
        updated: Date.now()
      };
    }

    function broadcastState() {
      if (!roomCode) return;
      var state = buildSyncState();
      try {
        localStorage.setItem(STORAGE_KEY + "_" + roomCode, JSON.stringify(state));
      } catch (e) {}
      try {
        if (syncBc) {
          syncBc.postMessage({ kind: "state", room: roomCode, state: state });
        }
      } catch (e) {}
      peerConns.forEach(function(c) {
        try {
          if (c.open) c.send({ kind: "state", state: state });
        } catch (e) {}
      });
    }

    function handleRemoteCommand(cmd) {
      if (!cmd || !cmd.type) return;

      // playlist.html'den gelen tüm çalma isteklerinde tam ekran zorla
      if (cmd.type === "next" || cmd.type === "prev" || cmd.type === "play" ||
          cmd.type === "setQueue" || cmd.type === "fullscreen") {
        }

      if (cmd.type === "fullscreen") {
          return;
      }
      if (cmd.type === "next") {
        playNext();
        return;
      }
      if (cmd.type === "prev") {
        playPrev();
        return;
      }
      if (cmd.type === "setMode") {
        queueLocked = cmd.mode === "manual";
        if (!queueLocked) {
          // Shuffle'a dönünce DOM listesine geri dön
          syncQueueFromDOM();
        }
        broadcastState();
        return;
      }
      if (cmd.type === "setQueue" && Array.isArray(cmd.queue)) {
        queueLocked = true;
        playQueue = cmd.queue.map(function(x) {
          return {
            id: x.id,
            title: x.title || "",
            author: x.author || "",
            duration: parseInt(x.duration, 10) || parseInt(x.lengthSeconds, 10) || 0
          };
        });
        playIndex = -1;
        if (currentPlayingId) {
          for (var i = 0; i < playQueue.length; i++) {
            if (playQueue[i].id === currentPlayingId) {
              playIndex = i;
              break;
            }
          }
        }
        // Hiçbir şey çalmıyorsa ve liste doluysa ilk şarkıyı otomatik başlat
        if (!currentPlayingId && playQueue.length > 0) {
          playAtIndex(0);
        } else {
          broadcastState();
        }
        return;
      }
      if (cmd.type === "play" && cmd.id) {
        var found = null;
        for (var i = 0; i < playQueue.length; i++) {
          if (playQueue[i].id === cmd.id) {
            found = playQueue[i];
            playIndex = i;
            break;
          }
        }
        if (found) {
          // Seçilen şarkı hemen autoplay ile çalsın
          playVideo(found.id, found.title, found.author, true);
        } else {
          playQueue.push({
            id: cmd.id,
            title: cmd.title || "",
            author: cmd.author || ""
          });
          playIndex = playQueue.length - 1;
          playVideo(cmd.id, cmd.title || "", cmd.author || "", true);
        }
      }
    }

    function initRoomSync() {
      roomCode = getOrCreateRoomCode();
      var el = document.getElementById("roomCodeEl");
      if (el) el.textContent = roomCode;

      try {
        syncBc = new BroadcastChannel(BC_NAME);
        syncBc.onmessage = function(ev) {
          var d = ev.data;
          if (!d || d.room !== roomCode) return;
          if (d.kind === "cmd" && d.cmd) handleRemoteCommand(d.cmd);
        };
      } catch (e) {}

      window.addEventListener("storage", function(ev) {
        if (ev.key === STORAGE_KEY + "_cmd_" + roomCode && ev.newValue) {
          try {
            handleRemoteCommand(JSON.parse(ev.newValue));
          } catch (e) {}
        }
      });

      // PeerJS host — farklı cihazlar için
      if (typeof Peer !== "undefined") {
        try {
          var hostId = ROOM_PREFIX + roomCode.toLowerCase();
          peerHost = new Peer(hostId);
          peerHost.on("connection", function(c) {
            peerConns.push(c);
            c.on("open", function() {
              c.send({ kind: "state", state: buildSyncState() });
            });
            c.on("data", function(data) {
              if (data && data.kind === "cmd" && data.cmd) {
                handleRemoteCommand(data.cmd);
              }
              if (data && data.kind === "hello") {
                c.send({ kind: "state", state: buildSyncState() });
              }
            });
            c.on("close", function() {
              peerConns = peerConns.filter(function(x) { return x !== c; });
            });
          });
          peerHost.on("error", function() {});
        } catch (e) {}
      }

      var badge = document.getElementById("roomBadge");
      var regenBtn = document.getElementById("regenCodeBtn");
      if (regenBtn) {
        regenBtn.addEventListener("click", function(e) {
          e.preventDefault();
          e.stopPropagation();
          if (!confirm("Yeni bağlantı kodu oluşturulsun mu? Eski kod çalışan cihazlarda geçersiz olur.")) return;
          roomCode = regenerateRoomCode();
          var el = document.getElementById("roomCodeEl");
          if (el) el.textContent = roomCode;
          var big = document.getElementById("qrCodeBig");
          if (big) big.textContent = roomCode;
          // QR yenile
          try {
            var base = location.href.replace(/index\.html.*$/i, "").replace(/\/?$/, "/");
            if (location.pathname.indexOf("index.html") === -1) {
              base = location.origin + location.pathname.replace(/\/[^/]*$/, "/");
            }
            var plUrl = base + "playlist.html?c=" + roomCode;
            var qrImage = document.getElementById("qrImage");
            if (qrImage) {
              qrImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=" + encodeURIComponent(plUrl);
            }
          } catch (err) {}
          if (toast) {
            toast.textContent = "Yeni kod: " + roomCode;
            toast.classList.add("show");
            setTimeout(function() { toast.classList.remove("show"); }, 2000);
          }
        });
      }

      var toast = document.getElementById("roomToast");
      var qrOverlay = document.getElementById("qrOverlay");
      var qrImage = document.getElementById("qrImage");
      var qrCodeBig = document.getElementById("qrCodeBig");
      var qrUrlText = document.getElementById("qrUrlText");
      var qrCopyBtn = document.getElementById("qrCopyBtn");
      var qrCloseBtn = document.getElementById("qrCloseBtn");

      function getPlaylistUrl() {
        // index ile aynı klasörde playlist.html
        var base = location.href;
        // .../index.html veya .../ veya .../repo/
        if (/index\.html/i.test(base)) {
          base = base.replace(/index\.html.*/i, "");
        } else if (!base.endsWith("/")) {
          // dosya adı yoksa dizin kabul et
          var idx = base.lastIndexOf("/");
          if (idx > 8) base = base.slice(0, idx + 1);
        }
        return base + "playlist.html?c=" + roomCode;
      }

      function openQrPopup() {
        var url = getPlaylistUrl();
        if (qrCodeBig) qrCodeBig.textContent = roomCode;
        if (qrUrlText) qrUrlText.textContent = url;
        if (qrImage) {
          qrImage.src =
            "https://api.qrserver.com/v1/create-qr-code/?size=120x120&margin=8&data=" +
            encodeURIComponent(url);
        }
        if (qrOverlay) qrOverlay.classList.add("show");
      }

      function closeQrPopup() {
        if (qrOverlay) qrOverlay.classList.remove("show");
      }

      if (badge) {
        badge.addEventListener("click", function() {
          openQrPopup();
        });
      }
      if (qrCloseBtn) {
        qrCloseBtn.addEventListener("click", closeQrPopup);
      }
      if (qrOverlay) {
        qrOverlay.addEventListener("click", function(e) {
          if (e.target === qrOverlay) closeQrPopup();
        });
      }
      if (qrCopyBtn) {
        qrCopyBtn.addEventListener("click", function() {
          var url = getPlaylistUrl();
          try {
            navigator.clipboard.writeText(url);
          } catch (e) {
            try { navigator.clipboard.writeText(roomCode); } catch (e2) {}
          }
          if (toast) {
            toast.textContent = "Playlist linki kopyalandı";
            toast.classList.add("show");
            setTimeout(function() { toast.classList.remove("show"); }, 2000);
          }
        });
      }

      broadcastState();
    }

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i];
        a[i] = a[j];
        a[j] = t;
      }
      return a;
    }

    function pickRandomQuery(catKey) {
      var list = CATEGORY_VARIANTS[catKey] || ["türkçe pop müzik"];
      return list[Math.floor(Math.random() * list.length)];
    }

    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveFavorites(list) {
      localStorage.setItem(FAV_KEY, JSON.stringify(list));
    }

    function isFavorite(id) {
      return getFavorites().some(function(v) {
        return v.videoId === id;
      });
    }

    function toggleFavorite(video) {
      var list = getFavorites();
      var idx = list.findIndex(function(v) {
        return v.videoId === video.videoId;
      });
      if (idx >= 0) {
        list.splice(idx, 1);
      } else {
        list.unshift({
          videoId: video.videoId,
          title: video.title || "",
          author: video.author || "",
          lengthSeconds: video.lengthSeconds || 0
        });
      }
      saveFavorites(list);
      return idx < 0;
    }

    var searchInput = document.getElementById("searchInput");
    var resultsEl = document.getElementById("results");
    var cats = document.getElementById("cats");
    var micBtn = document.getElementById("micBtn");

    function runVoiceSearch(q) {
      q = (q || "").trim();
      if (!q) return;

      document.querySelectorAll(".cat").forEach(function(c) {
        c.classList.remove("active");
      });

      currentMode = "search";
      currentCatKey = null;
      currentQuery = q;
      useCategoryRotate = false;
      doSearch(q, true, false);
    }

    cats.addEventListener("click", function(e) {
      var cat = e.target.closest(".cat");
      if (!cat) return;

      document.querySelectorAll(".cat").forEach(function(c) {
        c.classList.remove("active");
      });
      cat.classList.add("active");
      searchInput.value = "";

      if (cat.dataset.cat === "favorites") {
        currentMode = "favorites";
        currentCatKey = null;
        hasMore = false;
        isLoadingMore = false;
        awaitingSwipe = true;
        loadGen++;
        disconnectObserver();
        showFavorites();
      } else {
        currentMode = "search";
        currentCatKey = cat.dataset.cat;
        currentQuery = pickRandomQuery(currentCatKey);
        useCategoryRotate = true;
        categoryRotateIndex = Math.floor(Math.random() * ALL_QUERIES.length);
        doSearch(currentQuery, true, true);
      }
    });

    searchInput.addEventListener("focus", function() {
      if (searchInput.value) {
        searchInput.value = "";
      }
    });

    searchInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        var query = searchInput.value.trim();
        if (!query) return;
        runVoiceSearch(query);
        searchInput.value = "";
        try { searchInput.blur(); } catch (err) {}
      }

    micBtn.addEventListener("click", function(e) {
      e.preventDefault();
      e.stopPropagation();
      searchInput.value = "";
      searchInput.focus();
      setTimeout(function() {

    function createCardHtml(v) {
      var thumbUrl = "https://i.ytimg.com/vi/" + v.videoId + "/hqdefault.jpg";
      var duration = formatDuration(v.lengthSeconds);
      var views = v.viewCount ? formatViews(v.viewCount) : "";
      var fav = isFavorite(v.videoId);
      var heart = fav ? "♥" : "♡";
      var heartClass = fav ? "heart-btn fav" : "heart-btn";
      var meta = [];
      if (v.author) meta.push(escapeHtml(v.author));
      if (duration) meta.push(duration);
      if (views) meta.push(views);

      return (
        '<div class="card" data-id="' + v.videoId +
        '" data-title="' + escapeHtml(v.title) +
        '" data-author="' + escapeHtml(v.author || "") +
        '" data-len="' + (v.lengthSeconds || 0) + '">' +
        '<img src="' + thumbUrl + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/' +
        v.videoId + '/mqdefault.jpg\'" />' +
        '<button class="' + heartClass + '" data-action="fav" title="' +
        (fav ? "Favoriden çıkar" : "Favoriye ekle") + '">' + heart + '</button>' +
        '<div class="card-info">' +
        '<div class="card-title">' + escapeHtml(v.title) + '</div>' +
        '<div class="card-meta">' + meta.join(" · ") + '</div>' +
        '</div></div>'
      );
    }

    function attachCardListeners() {
      resultsEl.querySelectorAll(".card").forEach(function(card) {
        if (card.dataset.bound) return;
        card.dataset.bound = "1";

        card.addEventListener("click", function(e) {
          if (e.target.closest("[data-action=fav]")) {
            e.stopPropagation();
            var video = {
              videoId: card.dataset.id,
              title: card.dataset.title,
              author: card.dataset.author,
              lengthSeconds: parseInt(card.dataset.len, 10) || 0
            };
            var added = toggleFavorite(video);
            var btn = card.querySelector("[data-action=fav]");
            if (added) {
              btn.textContent = "♥";
              btn.classList.add("fav");
              btn.title = "Favoriden çıkar";
            } else {
              btn.textContent = "♡";
              btn.classList.remove("fav");
              btn.title = "Favoriye ekle";
              if (currentMode === "favorites") {
                card.remove();
                syncQueueFromDOM();
                if (!resultsEl.querySelector(".card")) {
                  resultsEl.innerHTML =
                    '<div class="empty">Henüz favori yok.<br>Şarkılara ♥ basarak ekleyebilirsin.</div>';
                }
              }
            }
            return;
          }
          playVideo(card.dataset.id, card.dataset.title, card.dataset.author || "", false, parseInt(card.dataset.len, 10) || 0);
        });
      });
    }

    function ensureSentinel() {
      var old = resultsEl.querySelector(".sentinel");
      if (old) old.remove();
      var tip = resultsEl.querySelector(".load-more");
      if (tip) tip.remove();
      if (!hasMore || currentMode === "favorites") return;

      var sentinel = document.createElement("div");
      sentinel.className = "sentinel";
      sentinel.id = "scrollSentinel";
      resultsEl.appendChild(sentinel);

      if (observer) observer.disconnect();
      observer = new IntersectionObserver(
        function(entries) {
          if (
            entries[0].isIntersecting &&
            hasMore &&
            !isLoadingMore &&
            !awaitingSwipe &&
            currentMode !== "favorites"
          ) {
            loadMore();
          }
        },
        {
          root: document.getElementById("home"),
          rootMargin: "80px",
          threshold: 0
        }
      );
      observer.observe(sentinel);
    }

    function disconnectObserver() {
      if (observer) {
        observer.disconnect();
        observer = null;
      }
    }

    function syncQueueFromDOM() {
      // Manuel playlist kilitliyken ana ekran listesi kuyruğu ezmesin
      if (queueLocked) {
        broadcastState();
        return;
      }
      playQueue = [];
      resultsEl.querySelectorAll(".card").forEach(function(card) {
        playQueue.push({
          id: card.dataset.id,
          title: card.dataset.title || "",
          author: card.dataset.author || "",
          duration: parseInt(card.dataset.len, 10) || 0
        });
      });
      // Mevcut şarkının index'ini koru
      if (currentPlayingId) {
        playIndex = -1;
        for (var i = 0; i < playQueue.length; i++) {
          if (playQueue[i].id === currentPlayingId) {
            playIndex = i;
            break;
          }
        }
      }
      broadcastState();
    }

    function renderCards(videos, isFavList, append) {
      if (!append) {
        disconnectObserver();
        if (!videos.length) {
          resultsEl.innerHTML = isFavList
            ? '<div class="empty">Henüz favori yok.<br>Şarkılara ♥ basarak ekleyebilirsin.</div>'
            : '<div class="empty">Sonuç bulunamadı</div>';
          playQueue = [];
          return;
        }
        // Her seferinde karıştır → aynı liste gibi görünmesin
        videos = shuffle(videos);
        resultsEl.innerHTML = videos.map(createCardHtml).join("");
      } else {
        if (!videos.length) {
          ensureSentinel();
          return;
        }
        resultsEl.querySelectorAll(".sentinel, .load-more, .loading").forEach(function(el) {
          el.remove();
        });
        // Append edilenleri de hafif karıştır
        videos = shuffle(videos);
        resultsEl.insertAdjacentHTML("beforeend", videos.map(createCardHtml).join(""));
      }

      resultsEl.querySelectorAll(".loading").forEach(function(el) {
        el.remove();
      });
      attachCardListeners();
      syncQueueFromDOM();

      if (currentMode !== "favorites") {
        ensureSentinel();
      }
    }

    function showFavorites() {
      hasMore = false;
      isLoadingMore = false;
      disconnectObserver();
      seenIds.clear();
      var list = getFavorites();
      list.forEach(function(v) { seenIds.add(v.videoId); });
      if (!list.length) {
        resultsEl.innerHTML =
          '<div class="empty">Henüz favori yok.<br>Şarkılara ♥ basarak ekleyebilirsin.</div>';
        playQueue = [];
        return;
      }
      resultsEl.innerHTML = list.map(createCardHtml).join("");
      attachCardListeners();
      syncQueueFromDOM();
    }

    async function fetchSearch(query, page, preferViews) {
      for (var i = 0; i < SEARCH_INSTANCES.length; i++) {
        var inst = SEARCH_INSTANCES[i];
        try {
          var url =
            inst +
            "/api/v1/search?q=" +
            encodeURIComponent(query) +
            "&type=video&page=" +
            page +
            "&region=TR";

          // Popüler / çok dinlenen için views sıralama
          if (preferViews) {
            url += "&sort=views";
          }

          var res = await fetch(url, {
            signal: AbortSignal.timeout(10000)
          });
          if (!res.ok) continue;
          var data = await res.json();
          if (!Array.isArray(data)) continue;
          return data.filter(function(item) {
            return item.type === "video" && item.videoId;
          });
        } catch (e) {
          console.warn("Search failed:", inst, e);
        }
      }
      return null;
    }

    async function doSearch(query, reset, preferViews) {
      if (preferViews === undefined) preferViews = true;

      if (reset) {
        loadGen++;
        // Her açılışta rastgele sayfa ile başla (1–4) → farklı sonuçlar
        currentPage = 1 + Math.floor(Math.random() * 4);
        seenIds.clear();
        hasMore = true;
        isLoadingMore = false;
        awaitingSwipe = false;
        currentMode = "search";
        disconnectObserver();
        resultsEl.innerHTML = '<div class="loading">Aranıyor...</div>';
        document.getElementById("home").scrollTop = 0;
      }

      var gen = loadGen;
      isLoadingMore = true;

      if (reset) {
        var initialCollected = [];
        var initialPages = 0;
        var initialTarget = 20;
        var maxInitialPages = 5;
        var lastPageHadEnough = false;
        var initialFailed = false;
        var startPage = currentPage;

        while (
          initialCollected.length < initialTarget &&
          initialPages < maxInitialPages
        ) {
          initialPages++;
          var pageToFetch = startPage + initialPages - 1;
          currentPage = pageToFetch;

          // Kategori ise ara sıra farklı varyasyon dene
          var q = query;
          if (useCategoryRotate && currentCatKey && initialPages > 1 && Math.random() < 0.45) {
            q = pickRandomQuery(currentCatKey);
          }

          var pageVideos = await fetchSearch(q, pageToFetch, preferViews);

          if (gen !== loadGen || currentMode === "favorites") {
            isLoadingMore = false;
            return;
          }

          if (pageVideos === null) {
            initialFailed = true;
            break;
          }

          lastPageHadEnough = pageVideos.length >= 6;

          for (var i = 0; i < pageVideos.length; i++) {
            var v = pageVideos[i];
            if (seenIds.has(v.videoId)) continue;
            // Çok kısa videoları (shorts / intro) ele
            if (v.lengthSeconds && v.lengthSeconds < 60) continue;
            seenIds.add(v.videoId);
            initialCollected.push(v);
            if (initialCollected.length >= batchSize) break;
          }

          if (!pageVideos.length) break;
        }

        isLoadingMore = false;

        if (initialFailed && !initialCollected.length) {
          resultsEl.innerHTML =
            '<div class="error">Bağlantı hatası. Sayfayı yenile veya biraz sonra dene.</div>';
          hasMore = false;
          return;
        }

        if (!initialCollected.length) {
          resultsEl.innerHTML = '<div class="empty">Sonuç bulunamadı</div>';
          hasMore = false;
          return;
        }

        if (initialCollected.length > batchSize) {
          initialCollected = initialCollected.slice(0, batchSize);
        }

        hasMore = lastPageHadEnough || initialCollected.length >= 12;
        renderCards(initialCollected, false, false);
        awaitingSwipe = false;
        return;
      }

      // append path (load more)
      var videos = await fetchSearch(query, currentPage, preferViews);

      if (gen !== loadGen || currentMode === "favorites") {
        isLoadingMore = false;
        return;
      }

      isLoadingMore = false;

      if (videos === null) {
        hasMore = false;
        return;
      }

      var unique = videos.filter(function(v) {
        if (seenIds.has(v.videoId)) return false;
        if (v.lengthSeconds && v.lengthSeconds < 60) return false;
        seenIds.add(v.videoId);
        return true;
      });

      if (unique.length > batchSize) {
        unique = unique.slice(0, batchSize);
      }

      hasMore = videos.length >= 6;
      renderCards(unique, false, true);
      awaitingSwipe = false;
    }

    async function loadMore() {
      if (isLoadingMore || !hasMore || currentMode === "favorites") return;
      if (awaitingSwipe) return;

      isLoadingMore = true;
      awaitingSwipe = true;
      var gen = loadGen;

      var existing = resultsEl.querySelector(".load-more");
      if (!existing) {
        var tip = document.createElement("div");
        tip.className = "load-more";
        tip.textContent = "Daha fazla yükleniyor...";
        var sen = resultsEl.querySelector(".sentinel");
        if (sen) resultsEl.insertBefore(tip, sen);
        else resultsEl.appendChild(tip);
      }

      var collected = [];
      var attempts = 0;
      var maxAttempts = 5;

      while (collected.length < batchSize && attempts < maxAttempts) {
        attempts++;
        var videos = null;

        if (useCategoryRotate && currentCatKey) {
          // Aynı kategorinin farklı varyasyonlarından + rastgele sayfa
          var nextQ = pickRandomQuery(currentCatKey);
          var pageForCat = 1 + Math.floor(Math.random() * 6) + Math.floor(seenIds.size / 15);
          videos = await fetchSearch(nextQ, pageForCat, true);
        } else {
          currentPage += 1;
          videos = await fetchSearch(currentQuery, currentPage, false);
        }

        if (gen !== loadGen || currentMode === "favorites") {
          isLoadingMore = false;
          resultsEl.querySelectorAll(".load-more").forEach(function(el) { el.remove(); });
          return;
        }

        if (videos === null) {
          hasMore = false;
          break;
        }

        if (videos.length < 4) {
          hasMore = false;
        }

        for (var i = 0; i < videos.length && collected.length < batchSize; i++) {
          var v = videos[i];
          if (seenIds.has(v.videoId)) continue;
          if (v.lengthSeconds && v.lengthSeconds < 60) continue;
          seenIds.add(v.videoId);
          collected.push(v);
        }

        if (!hasMore) break;
      }

      resultsEl.querySelectorAll(".load-more").forEach(function(el) { el.remove(); });

      if (collected.length > 0) {
        renderCards(collected, false, true);
        hasMore = true;
      } else {
        hasMore = false;
      }

      isLoadingMore = false;
    }

    var homeEl = document.getElementById("home");
    homeEl.addEventListener(
      "scroll",

    var _playNextLockUntil = 0;

    // Öneri ekranı çıkmasın diye bitişten bu kadar sn önce sonraki şarkıya geç
    var EARLY_SKIP_SEC = 1.5;

    function clearTrackTimers() {

    function scheduleEndFromPosition(positionSec, durationSec, reason) {
      clearTrackTimers();
      positionSec = Math.max(0, Number(positionSec) || 0);
      durationSec = Number(durationSec) || _trackDurationSec || 0;
      _lastKnownPos = positionSec;
      if (durationSec < 8) {
        if (_debugYt) console.log("[MM] scheduleEnd: süre yok, timer yok", reason);
        return;
      }
      // Bitişten EARLY_SKIP_SEC sn önce geç → öneri ekranı açılmaz
      var remaining = durationSec - positionSec - EARLY_SKIP_SEC;
      if (remaining < 1) remaining = 1;
      var durMs = remaining * 1000;
      if (_debugYt) console.log(
        "[MM] scheduleEnd",
        reason,
        "pos=",
        positionSec.toFixed(1),
        "dur=",
        durationSec,
        "early=",
        EARLY_SKIP_SEC,
        "remaining≈",
        remaining.toFixed(1),
        "sn"
      );
      _trackEndTimer = setTimeout(function() {
        if (_earlySkipDoneFor === currentPlayingId) return;
        _earlySkipDoneFor = currentPlayingId || "";
        console.log("[MM] erken geçiş → sıradaki", "dur=", durationSec, "reason=", reason);
        _armedForId = "";
        playNext();
      }, durMs);
      _armedForId = currentPlayingId || "";

      // YT.Player varsa konum poll: süre API'den gelince daha isabetli erken geçiş
      if (_trackWatchdog) {
        try { clearInterval(_trackWatchdog); } catch (e) {}
        _trackWatchdog = null;
      }
      _trackWatchdog = setInterval(function() {
        try {
          if (!ytPlayerInstance || !currentPlayingId) return;
          if (_earlySkipDoneFor === currentPlayingId) return;
          if (Date.now() < (window._ytIgnoreEndedUntil || 0)) return;
          var t = 0;
          var d = durationSec || _trackDurationSec || 0;
          try {
            if (typeof ytPlayerInstance.getCurrentTime === "function") {
              t = ytPlayerInstance.getCurrentTime() || 0;
            }
            if (typeof ytPlayerInstance.getDuration === "function") {
              var gd = ytPlayerInstance.getDuration() || 0;
              if (gd > 8) d = gd;
            }
          } catch (e1) {}
          if (d < 8) return;
          _lastKnownPos = t;
          if (t >= d - EARLY_SKIP_SEC) {
            _earlySkipDoneFor = currentPlayingId || "";
            clearTrackTimers();
            console.log("[MM] poll erken geçiş", t.toFixed(1), "/", d.toFixed(1));
            playNext();
          }
        } catch (e2) {}
      }, 500);
    }

    function armTrackEndWatch(durationSec, force) {
      durationSec = parseInt(durationSec, 10) || 0;
      _trackDurationSec = durationSec;
      _trackStartedAt = Date.now();
      _lastKnownPos = 0;
      if (!force && _armedForId && _armedForId === currentPlayingId && _trackEndTimer) {
        return;

      scheduleEndFromPosition(0, durationSec, "start");

    // Seek / konum güncellemesi — embed currentTime verirse timer yenilenir
    function onTrackPosition(positionSec, durationSec) {

      if (Date.now() < (window._ytIgnoreEndedUntil || 0)) return;
      durationSec = durationSec || _trackDurationSec || window._ytDuration || 0;
      positionSec = Number(positionSec) || 0;

      // Loop: büyük zamandan başa sıçrama
      if (_lastKnownPos > 15 && positionSec < 3) {
        console.log("[MM] loop/seek-to-start tespit → playNext");
        playNext();
        return;
      }

      // Anlamlı seek: 3 sn'den fazla zıplama → timer'ı kalan süreye göre kur
      if (Math.abs(positionSec - _lastKnownPos) > 3) {
        scheduleEndFromPosition(positionSec, durationSec, "seek/pos");
      } else {
        _lastKnownPos = positionSec;
      }
      window._ytLastKnownTime = positionSec;
      if (durationSec > 0) window._ytDuration = durationSec;

    function playAtIndex(idx) {
      if (!playQueue.length) {
        console.warn("[MM] playAtIndex: kuyruk boş");
        return;
      }
      if (idx < 0) idx = playQueue.length - 1;
      if (idx >= playQueue.length) idx = 0;

      // Aynı şarkıya yapışmayı engelle
      var tries = 0;
      while (
        playQueue.length > 1 &&
        playQueue[idx].id === currentPlayingId &&
        tries < playQueue.length
      ) {
        idx = (idx + 1) % playQueue.length;
        tries++;
      }

      playIndex = idx;
      var item = playQueue[idx];
      if (_debugYt) console.log("[MM] playAtIndex", idx, item.id, item.title, "queue=", playQueue.length);
      playVideo(item.id, item.title, item.author, true, item.duration || 0);
    }

    function playNext() {
      var now = Date.now();
      // Çift tetiklemeyi kes (ended + timer aynı anda)
      if (now < _playNextLockUntil) {
        if (_debugYt) console.log("[MM] playNext kilitli, atlandı");
        return;
      }
      _playNextLockUntil = now + 2800;
      clearTrackTimers();
      _armedForId = "";
      _trackStartedAt = 0;
      window._ytIgnoreEndedUntil = now + 3500;


      if (!queueLocked) {
        syncQueueFromDOM();
      }

      if (!playQueue.length && currentPlayingId) {
        playQueue = [{
          id: currentPlayingId,
          title: currentPlayingTitle || "",
          author: currentPlayingAuthor || "",
          duration: 0
        }];
        playIndex = 0;
      }

      if (!playQueue.length) {
        console.warn("[MM] playNext: kuyruk boş");
        return;
      }

      // Mevcut index
      var found = -1;
      for (var j = 0; j < playQueue.length; j++) {
        if (playQueue[j].id === currentPlayingId) {
          found = j;
          break;
        }
      }
      if (found >= 0) playIndex = found;
      if (playIndex < 0 || playIndex >= playQueue.length) playIndex = 0;

      var next = playIndex + 1;
      if (next >= playQueue.length) next = 0;

      // Aynı ID ise atla
      var guard = 0;
      while (
        playQueue.length > 1 &&
        playQueue[next].id === currentPlayingId &&
        guard < playQueue.length
      ) {
        next = (next + 1) % playQueue.length;
        guard++;
      }

      if (_debugYt) console.log(
        "[MM] playNext",
        playIndex,
        "→",
        next,
        playQueue[next] && playQueue[next].id,
        "locked=",
        queueLocked,
        "len=",
        playQueue.length
      );

      // Aynı player oturumunu bozma — src blank yapma; sadece stop, loadVideoById yapacak
      try {
        if (ytPlayerInstance && ytPlayerInstance.stopVideo) ytPlayerInstance.stopVideo();
      } catch (e1) {}

      playAtIndex(next);
      // otomatik tam ekran yok
    }

    function playPrev() {
      var now = Date.now();
      if (now < _playNextLockUntil) return;
      _playNextLockUntil = now + 2800;
      clearTrackTimers();
      _armedForId = "";
      _trackStartedAt = 0;
      window._ytIgnoreEndedUntil = now + 3500;

      if (!queueLocked) {
        syncQueueFromDOM();

      if (!playQueue.length && currentPlayingId) {

        if (playQueue[j].id === currentPlayingId) {
          found = j;
          break;
        }
      }
      if (found >= 0) playIndex = found;

      var prev = playIndex - 1;
      if (prev < 0) prev = playQueue.length - 1;

      var guard = 0;
      while (
        playQueue.length > 1 &&
        playQueue[prev].id === currentPlayingId &&
        guard < playQueue.length
      ) {
        prev = prev - 1;
        if (prev < 0) prev = playQueue.length - 1;
        guard++;
      }

      try {
        if (ytPlayerInstance && ytPlayerInstance.stopVideo) ytPlayerInstance.stopVideo();
      } catch (e) {}

            break;
          }
        }
        if (playIndex < 0) {
          playQueue.push({
            id: id,
            title: title || "",
            author: author || "",
            duration: durationSec || 0
          });
          playIndex = playQueue.length - 1;
        }
      }

      // Süre: argüman veya kuyruktan
      var dur = durationSec || 0;
      if (!dur && playIndex >= 0 && playQueue[playIndex]) {
        dur = playQueue[playIndex].duration || 0;
      }

      currentPlayingId = id;
      currentPlayingTitle = title || "";
      currentPlayingAuthor = author || "";
      _earlySkipDoneFor = "";
      playerTitle.textContent = title || "";
      updateMediaSession(title, author, id);
      broadcastState();

      // Süre biliniyorsa yedek bitiş zamanlayıcısı (ENDED kaçarsa)
      armTrackEndWatch(dur);

      _currentLoadDuration = dur || 0;
      if (_debugYt) console.log("[MM] playVideo", id, "dur=", dur, "queue=", playQueue.length, "idx=", playIndex);

      var alreadyOpen = playerView.classList.contains("active");
      if (alreadyOpen) {
        setPlayerLoading(true, fromQueue ? "Sonraki şarkı yükleniyor..." : "Yükleniyor...");
        loadVideoInSamePlayer(id, dur);
      } else {
        playerView.classList.add("active");
        setPlayerLoading(true, "Yükleniyor...");
        loadVideoInSamePlayer(id, dur);
      }
    }

    backBtn.addEventListener("click", function() {
      try {
        if (audioPlayer) {
          audioPlayer.pause();
          audioPlayer.removeAttribute("src");
          audioPlayer.load();
        }
      } catch (e) {}
      try {
        if (ytplayer) {
          ytplayer.onload = null;
          ytplayer.src = "";
        }
      } catch (e) {}
      playerView.classList.remove("active");
      setPlayerLoading(false);
      currentPlayingId = "";
      currentPlayingTitle = "";
      currentPlayingAuthor = "";
      clearMediaSession();
      broadcastState();
    });


    // Sekme tekrar görünür olunca çalmaya devam etmeyi dene
    document.addEventListener("visibilitychange", function() {
      if (document.hidden) return;
      if (!currentPlayingId) return;
      try {
        var f = document.getElementById("ytplayer");
        if (f && f.contentWindow) {
          f.contentWindow.postMessage(
            JSON.stringify({ event: "command", func: "playVideo", args: [] }),
            "*"
          );
          f.contentWindow.postMessage(
            JSON.stringify({ event: "command", func: "unMute", args: [] }),
            "*"
          );
        }
      } catch (e) {}
      try {
        bumpMediaSessionPlaying();
        bindMediaSessionHandlers();
      } catch (e2) {}
    });

    prevBtn.addEventListener("click", function() {
      playPrev();
    });

    nextBtn.addEventListener("click", function() {
      playNext();
    });

    // Donanım / sistem medya tuşları (bazı multimedya sistemleri)
    window.addEventListener("keydown", function(e) {
      if (e.key === "MediaTrackNext") {
        e.preventDefault();
        playNext();
      } else if (e.key === "MediaTrackPrevious") {
        e.preventDefault();
        playPrev();
      }
    });

    function formatDuration(sec) {
      if (!sec) return "";
      var m = Math.floor(sec / 60);
      var s = sec % 60;
      return m + ":" + s.toString().padStart(2, "0");
    }

    function formatViews(n) {
      if (!n) return "";
      if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(0) + "K";
      return String(n);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // İlk yükleme — rastgele sorgu + views sıralama + karıştırma
    useCategoryRotate = true;
    currentCatKey = "turkce-pop";
    currentQuery = pickRandomQuery("turkce-pop");



    initRoomSync();
    doSearch(currentQuery, true, true);
  </script>
</body>
</html>
